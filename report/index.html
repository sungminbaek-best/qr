<section class="top"><div class="wrap">
  <h1>오류 신고</h1>
  <p>교재에서 틀린 곳을 찾으셨나요? 알려 주시면 확인해서 다음 인쇄 때 바로 고칠게요. <br>이름이나 연락처는 받지 않아요.</p>

  <form class="jbox" id="rf" novalidate>
    <label class="fld"><span>교재</span><select name="book"><option value="">선택해 주세요</option><optgroup label="파닉스"><option value="ph1">저절로 파닉스 1</option><option value="ph2">저절로 파닉스 2</option></optgroup><optgroup label="스타터"><option value="rst1">저절로 스타터 1</option><option value="rst2">저절로 스타터 2</option></optgroup><optgroup label="브릿지"><option value="rbr1">저절로 브릿지 1</option><option value="rbr2">저절로 브릿지 2</option></optgroup><optgroup label="입문"><option value="rin1">저절로 입문 1</option><option value="rin2">저절로 입문 2</option></optgroup><optgroup label="기본"><option value="rba1">저절로 기본 1</option><option value="rba2">저절로 기본 2</option></optgroup><optgroup label="첫모의고사"><option value="rmo1">저절로 첫모의고사 1</option><option value="rmo2">저절로 첫모의고사 2</option></optgroup><optgroup label="그래머&amp;라이팅"><option value="gw1">저절로 그래머&amp;라이팅 1</option><option value="gw2">저절로 그래머&amp;라이팅 2</option></optgroup><option value="etc">기타 · 잘 모르겠어요</option></select></label>
    <label class="fld"><span>쪽·위치<em>선택</em></span><input type="text" name="page" maxlength="30" placeholder="예: 44쪽 3번, 유닛 5 단어"></label>
    <div class="fld"><span>어떤 오류인가요?</span><div class="opts"><label><input type="radio" name="kind" value="오타·맞춤법"><span>오타·맞춤법</span></label><label><input type="radio" name="kind" value="정답 오류"><span>정답 오류</span></label><label><input type="radio" name="kind" value="해석·뜻 오류"><span>해석·뜻 오류</span></label><label><input type="radio" name="kind" value="음원·QR"><span>음원·QR</span></label><label><input type="radio" name="kind" value="기타"><span>기타</span></label></div></div>
    <label class="fld"><span>내용</span><textarea name="body" maxlength="1000" placeholder="예: 3번 문제 정답이 ②로 되어 있는데 ③이 맞는 것 같아요."></textarea></label>
    <div class="cnt" id="cnt">0 / 1000</div>
    <label class="hp" aria-hidden="true">비워 두세요<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
    <button class="go1 full" type="submit">신고 보내기</button>
    <div class="jerr" id="re" role="alert"></div>
    <p class="small">답변이 필요한 문의는 톡톡으로 보내 주세요. <a class="talk">톡톡 열기</a></p>

<script>
var S=SOLVEU,$=S.$,f=$("#rf"),q=new URLSearchParams(location.search);
if(q.get("book"))f.book.value=q.get("book");if(q.get("page"))f.page.value=q.get("page").slice(0,30);
f.body.addEventListener("input",function(){$("#cnt").textContent=f.body.value.length+" / 1000";});
function show(id){["#rf","#rdone"].forEach(function(k){$(k).hidden=k!==id;});}
f.addEventListener("submit",function(e){e.preventDefault();var b=$("#rf .go1");
  var kind=(f.querySelector("[name=kind]:checked")||{}).value;
  var v={book:f.book.value,page:f.page.value.trim(),kind:kind,body:f.body.value.trim(),website:f.website.value};
  if(!v.book||!v.kind||v.body.length<2){$("#re").textContent="교재·종류·내용을 입력해 주세요.";return;}
  b.disabled=true;$("#re").textContent="";
  S.api("/api/report",v).then(function(j){b.disabled=false;
    if(j.ok){f.page.value="";f.body.value="";$("#cnt").textContent="0 / 1000";show("#rdone");scrollTo(0,0);}
    else $("#re").textContent=j.msg||"잠시 뒤 다시 보내 주세요.";});});
$("#again").addEventListener("click",function(){show("#rf");});
</script>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>발음 후보 듣기</title><style>
:root{--bg:#f6f7fb;--fg:#1a1d29;--card:#fff;--ac:#3b6fe0;--mut:#e9ecf5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171f;--fg:#e8eaf2;--card:#232633;--ac:#6f95ff;--mut:#1c1f2a}}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;margin:0 auto;padding:20px 16px;max-width:560px}
h1{font-size:20px;margin:0 0 6px}p{opacity:.75;font-size:14px;margin:0 0 14px}p.note{font-size:13px;margin:0 0 10px}
section{background:var(--card);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 3px #0002}
h2{font-size:16px;margin:0 0 10px}.row{display:flex;flex-wrap:wrap;gap:8px}
button{flex:1 1 30%;min-width:90px;padding:14px 8px;font-size:15px;border:0;border-radius:10px;background:var(--mut);color:var(--fg);cursor:pointer}
button.ref{flex-basis:100%;opacity:.8}button.on{outline:3px solid var(--ac)}
</style></head><body><h1>동사 강세 후보 듣기</h1><p>뒤쪽에 강세가 오는 후보 번호를 알려주세요. 모두 앞 강세면 "없음"이라고 해주세요.</p>
<section><h2>record 기록하다 (re-CORD, 뒤 강세)</h2><div class="row"><button onclick="p('record_0',this)" class="ref">현재 소리 (앞 강세)</button><button onclick="p('record_1',this)">후보 1</button><button onclick="p('record_2',this)">후보 2</button></div></section>
<section><h2>produce 생산하다 (pro-DUCE, 뒤 강세) — 첫모의1 U2·U6·U13·U14 공통</h2><div class="row"><button onclick="p('produce_0',this)" class="ref">현재 소리 (앞 강세)</button><button onclick="p('produce_1',this)">후보 1</button><button onclick="p('produce_2',this)">후보 2</button><button onclick="p('produce_3',this)">후보 3</button></div></section>
<section><h2>increase 증가시키다 (in-CREASE, 뒤 강세) — 첫모의1 U2, 첫모의2 U6·U9 공통</h2><div class="row"><button onclick="p('increase_0',this)" class="ref">현재 소리 (앞 강세)</button><button onclick="p('increase_1',this)">후보 1</button><button onclick="p('increase_2',this)">후보 2</button><button onclick="p('increase_3',this)">후보 3</button></div></section>
<script>const a=new Audio();function p(t,el){document.querySelectorAll('button').forEach(b=>b.classList.remove('on'));el.classList.add('on');a.src=t+'.mp3?v='+Date.now();a.play()}</script>
</body></html>

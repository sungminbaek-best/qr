<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>저그랑1 단어 시험본</title><style>
:root{--bg:#f6f7fb;--fg:#1a1d29;--card:#fff;--ac:#3b6fe0;--mut:#e9ecf5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171f;--fg:#e8eaf2;--card:#232633;--ac:#6f95ff;--mut:#1c1f2a}}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;margin:0 auto;padding:20px 16px;max-width:560px}
h1{font-size:20px;margin:0 0 6px}p{opacity:.75;font-size:14px;margin:0 0 14px}
button{display:block;width:100%;margin:10px 0;padding:16px;font-size:16px;border:0;border-radius:12px;background:var(--card);color:var(--fg);box-shadow:0 1px 3px #0002;cursor:pointer;text-align:left}
button.on{outline:3px solid var(--ac)}</style></head><body><h1>저그랑1 단어 음원 시험본</h1>
<p>①과 ②의 속도·간격이 같은지 들어봐 주세요. 구조: Number one → 단어 → 단어 → (쓰는 시간) → Number two …</p><button onclick="p('g2',this)">① 저그랑2 원본 (기준, 앞 25초)</button><button onclick="p('new',this)">② 새 저그랑1 U1 (잭슨·속도 0.75, 앞 25초)</button><button onclick="p('old',this)">③ 현재 저그랑1 U1 (비교용)</button><button onclick="p('new_full',this)">새 저그랑1 U1 전체 듣기</button>
<script>const a=new Audio();function p(t,el){document.querySelectorAll('button').forEach(b=>b.classList.remove('on'));el.classList.add('on');a.src=t+'.mp3?v='+Date.now();a.play()}</script></body></html>

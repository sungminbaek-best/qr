function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
/* 숙제 녹음 — 휴대폰 안에서 녹음·mp3로 바꾸고, 공유(카카오톡 등)로 선생님께. 쏠뷰 서버로는 안 보냄 */
let recState=null;
function loadLame(){ return window.lamejs?Promise.resolve():new Promise((ok,no)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js'; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); }
async function toMp3(blob){ await loadLame(); const AC=window.AudioContext||window.webkitAudioContext; const ac=new AC();
  const buf=await new Promise((ok,no)=>blob.arrayBuffer().then(ab=>ac.decodeAudioData(ab,ok,no)).catch(no)); try{ac.close();}catch(e){}
  const SR=22050, off=new OfflineAudioContext(1,Math.max(1,Math.ceil(buf.duration*SR)),SR), src=off.createBufferSource(); src.buffer=buf; src.connect(off.destination); src.start();
  const r=await off.startRendering(), f=r.getChannelData(0), pcm=new Int16Array(f.length);
  for(let i=0;i<f.length;i++){ const v=Math.max(-1,Math.min(1,f[i])); pcm[i]=v<0?v*0x8000:v*0x7fff; }
  const enc=new lamejs.Mp3Encoder(1,SR,64), out=[];

function inAppOut(kind){ const ua=navigator.userAgent, and=/Android/i.test(ua);

  if(ok) return null;

  if(/KAKAOTALK/i.test(ua)) return {app:'카카오톡', link:'kakaotalk://web/openExternal?url='+encodeURIComponent(href), btn:(and?'크롬':'사파리')+'으로 열기'};
  if(/NAVER\(inapp|NAVER/i.test(ua)) return and? {app:'네이버 앱', link:'intent://'+href.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;end', btn:'크롬으로 열기'}
    : {app:'네이버 앱', link:'', btn:''};
  return null; }
function openRec(b,u,S,kind,pg,ctl){   // S=[{e,k}] kind='단어'|'문장' pg='p.25'(파닉스) ctl=음원 조종(따라 말하며 녹음)
  closeRec(); const OUT=inAppOut(kind); const NK='solveu_rec_name'; let n0=''; try{ n0=localStorage.getItem(NK)||''; }catch(e){}
  const W=(kind==='단어');
  const items=S.map((s,i)=>'<li>'+(W?'<i>'+(i+1)+'</i>':'')+'<b>'+esc(s.e)+'</b>'+(s.k?'<span>'+esc(s.k)+'</span>':'')+'</li>').join('');
  document.body.insertAdjacentHTML('beforeend','<div class="rk'+(W?'':' full')+'" id="rec" role="dialog" aria-modal="true" aria-label="'+kind+' 녹음"><div class="sh">'+

    (OUT?'<div class="inapp"><b>먼저 아래 버튼을 눌러 주세요</b>'+(OUT.link?'지금 화면('+OUT.app+')에서는 녹음을 선생님께 보낼 수 없어요. 버튼을 누르면 보낼 수 있는 화면으로 바뀌어요.<a href="'+esc(OUT.link)+'">녹음하러 가기 →</a>':'지금 화면('+OUT.app+')에서는 녹음을 선생님께 보낼 수 없어요. 오른쪽 아래 ⋯ 를 누르고 "다른 브라우저로 열기"를 눌러 주세요.')+'</div>':'')+
    '<div class="read" id="recRead"><ol class="ls '+(W?'w':'s')+'">'+items+'</ol>'+
      (W?'<div class="bar"><button class="rb" type="button" id="recGo" aria-label="녹음"><i></i></button><p id="recTm"><b>눌러서 녹음 시작</b>위에서부터 읽어요</p></div>'
        :((ctl?'<label class="sync"><input type="checkbox" id="recSync">음원 듣고 따라 말하며 녹음</label><div class="cue" id="recCue" hidden>지금 따라 말해요</div>':'')+
          '<div class="bot"><button class="pill" type="button" id="recGo"><i></i><span id="recTm">녹음 시작</span></button></div>'))+'</div>'+
    '<div class="done" id="recDone" hidden><div class="ok">✓</div><b>녹음 완료</b><small id="recLen"></small><audio id="recAu" controls></audio>'+
      '<label class="nm"><span>이름</span><input id="recName" maxlength="12" autocomplete="name" placeholder="선생님이 알아보도록" value="'+esc(n0)+'"></label>'+
      '<button class="send" type="button" id="recSend">선생님께 보내기</button><button class="re" type="button" id="recRe">다시 녹음</button></div>'+
    '<p class="msg" id="recMsg"></p></div></div>');
  const $r=id=>document.getElementById(id), go=$r('recGo'), tm=$r('recTm'), live=$r('recLive'), read=$r('recRead'), done=$r('recDone'), rau=$r('recAu'), msg=$r('recMsg'), nameIn=$r('recName');
  const st=recState={mr:null,stream:null,tmr:null,file:null,ext:'mp3',chunks:[],sec:0,ctl:null};
  const sync=$r('recSync'), cue=$r('recCue'), lis=[...document.querySelectorAll('#rec .ls li')];
  function mark(i){ lis.forEach((x,j)=>x.classList.toggle('cur',j===i)); if(lis[i]) lis[i].scrollIntoView({block:'center',behavior:'smooth'}); }
  const mmss=x=>Math.floor(x/60)+':'+String(x%60).padStart(2,'0');
  function idle(){ go.classList.remove('on'); if(W) tm.innerHTML='<b>눌러서 녹음 시작</b>위에서부터 읽어요'; else tm.textContent='녹음 시작'; live.hidden=true; }
  function fname(){ const d=new Date(), who=(nameIn.value.trim()||'이름없음').replace(/[\\/:*?"<>|\s]/g,'');
    return who+'_'+nm(b).replace(/\s/g,'')+'_U'+u+(pg?'_'+pg.replace('.',''):'')+'_'+kind+'_'+(d.getMonth()+1)+'월'+d.getDate()+'일.'+st.ext; }
  function say(t,ok){ msg.textContent=t; msg.classList.toggle('ok',!!ok); }
  async function start(){
    if(!navigator.mediaDevices||!window.MediaRecorder){ say('이 브라우저는 녹음이 안 돼요. 크롬이나 사파리로 열어 주세요.'); return; }
    try{ st.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }
    catch(e){ say('마이크를 쓸 수 없어요. 마이크 권한을 허용해 주세요. 카카오톡·네이버 앱 안에서 열었다면 "다른 브라우저로 열기"를 눌러 주세요.'); return; }
    done.hidden=true; read.hidden=false; say(''); st.file=null; st.blob=null; st.chunks=[]; st.mr=new MediaRecorder(st.stream);

    const t0=Date.now(); st.sec=0; go.classList.add('on'); live.hidden=W; live.textContent='0:00';
    const draw=()=>{ st.sec=Math.floor((Date.now()-t0)/1000); if(W) tm.innerHTML='<b>녹음 중 '+mmss(st.sec)+'</b>다 읽으면 눌러요'; else { tm.textContent='녹음 끝내기'; live.textContent=mmss(st.sec); } };

  function stopRec(){ if(st.ctl){ st.ctl.hook(null); st.ctl.stop(); st.ctl=null; } if(cue) cue.hidden=true; mark(-1); if(st.mr&&st.mr.state!=='inactive') st.mr.stop(); if(st.stream) st.stream.getTracks().forEach(t=>t.stop()); clearInterval(st.tmr); idle(); if(W) tm.innerHTML='<b>파일 만드는 중…</b>잠깐만 기다려요'; }

function closeRec(){ const m=document.getElementById('rec'); if(!m) return; const st=recState;

function bookByCode(c){ return BOOKS.find(b=>b.code===c); }
function parse(){ const q=new URLSearchParams(location.search); let book=q.get('book'), u=parseInt(q.get('u'));
  const c=q.get('c'); if(c){ const m=c.match(/^([a-z]+\d+)u(\d+)/i); if(m){ book=book||m[1]; if(!u)u=parseInt(m[2]); } }
  return {book, u:(u>=1?u:null)}; }
function go(params, push){ const qs=new URLSearchParams();
  if(params.book) qs.set('book',params.book); if(params.u) qs.set('u',params.u); if(params.tab) qs.set('tab',params.tab);

  document.title=nm(b)+' 음원·강의 · 쏠뷰';
  let top='';
  const vids=(b.book_resources||[]).filter(r=>r.type==='video'&&r.url);
  if(vids.length){
    const chips=vids.map(r=>'<a class="orient" href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.label||'영상')+' ↗</a>').join('');
    top='<div class="orientbox"><h2>'+esc(b.orient_title||'오리엔테이션 영상')+'</h2><div class="orientgrid">'+chips+'</div></div>';
  }
  const cards=b.units.map(un=>{
    const hasA=(un.audio&&(un.audio.word||un.audio.sent))||(un.pages&&un.pages.length)||un.np;
    const vlist=(un.videos&&un.videos.length)? un.videos : (un.video? [{label:'강의 영상',url:un.video}] : []);
    const a=hasA? '<button class="ubtn main" type="button" data-go="leaf" data-book="'+b.code+'" data-u="'+un.n+'">'+IC_HP+'음원 듣기</button>'
                : (vlist.length? '' : '<span class="ubtn off">준비 중</span>');
    const vid=vlist.map(v=>'<a class="ubtn" href="'+esc(v.url)+'" target="_blank" rel="noopener">'+IC_PL+esc(v.label)+' ↗</a>').join('');
    return '<div class="ucard"><div class="ut">Unit '+un.n+'</div><div class="ubtns">'+a+vid+'</div></div>';
  }).join('');
  const sl=slugOf(b.code);
  app.innerHTML='<nav class="crumb" aria-label="위치"><button type="button" data-go="home">음원·강의</button><span>›</span><span>'+esc(nm(b))+'</span></nav>'+
    '<div class="bhead">'+cover(b)+'<div class="tx"><h1>'+esc(nm(b))+'</h1></div>'+(sl?'<a class="btn line sm" href="/books/'+sl+'/">교재 소개 →</a>':'')+'</div>'+
    top+'<div class="ugrid">'+cards+'</div>';
}

const IC_HP='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="5" height="7" rx="2" fill="currentColor"/><rect x="16" y="14" width="5" height="7" rx="2" fill="currentColor"/></svg>';
const IC_PL='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13l11-6.5z"/></svg>';
let miniIO=null, stkIO=null, shadowTimer=null, holdAfter=null;
/* QR 음원 화면 아래 '선생님이세요?' 한 줄 — 책 QR은 어디서 산 책이든 원장님을 만나는 곳(학생 화면은 가리지 않게 본문 맨 아래) */
const TSOON=false;   // 선생님 영역 준비 중이면 '선생님이세요?' 줄 숨김
const GEN=['rst1','rst2','rbr1','rbr2','rin1','rin2','rba1','rba2','rmo1','rmo2','gw1','gw2'];   // 시험지 생성기에 있는 책
const QRC=new URLSearchParams(location.search).get('c')||'';                         // 처음 들어온 QR 코드
function teacherLine(b,u){
  if(TSOON) return '';
  const dest=GEN.indexOf(b.code)>=0 ? '/교사포털/시험지생성기/?book='+b.code+'&u='+u : '/library/#teacher';
  const ok=window.SOLVEU&&SOLVEU.isOK&&SOLVEU.isOK();
  const href=ok? dest : '/library/join/?from='+(QRC?'qr':'studio')+'&code='+encodeURIComponent(QRC||(b.code+'u'+u))+'&next='+encodeURIComponent(dest);
  return '<a class="tline" href="'+href+'"><b>선생님이세요?</b><span>이 유닛 워크북 · 수업 자료 무료</span><i>→</i></a>';
}
function fmt(s){ s=Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function leaf(b,u,selP){
  const un=b.units[u-1]; document.title=nm(b)+' Unit '+u+' · 쏠뷰';
  const PAGES=(un.pages&&un.pages.length)?un.pages:null;
  selP=(PAGES && selP>=0 && selP<PAGES.length)?selP:0;
  const src=PAGES?PAGES[selP]:un;   // 페이지 있으면 그 페이지가 단어/음원 출처
  const isSentPage=!!(PAGES && src.sents && src.sents.length);  // 문장읽기 페이지
  const A=PAGES?(isSentPage?{sent:src.audio||''}:{word:src.audio||''}):(un.audio||{});
  const types=[]; if(A.word)types.push({k:'word',l:'단어'}); if(A.sent)types.push({k:'sent',l:'문장'});
  // QR 코드 끝이 s(문장)/w(단어)면 그 음원을 먼저 선택 — 처음 들어온 그 유닛에서만
  const PREF=(function(){ const m=QRC.match(/^([a-z]+\d+)u0*(\d+)([ws])$/i); if(m && m[1]===b.code && parseInt(m[2],10)===u) return m[3].toLowerCase()==='s'?'sent':'word'; return null; })();
  const T0=Math.max(0, types.findIndex(t=>t.k===PREF));
  const ST=isSentPage?(src.st||null):(PAGES?null:(un.st||null));
  const SE=isSentPage?(src.se||null):(PAGES?null:(un.se||null));  // 문장 끝시각(따라 말하기: 끝나자마자 멈춤)  // 문장 시작시각(탭재생/하이라이트/반복)
  const WT=isSentPage?null:(src.wt||null);  // 단어 시작시각(파닉스 등: 단어 탭재생)
  const SENTSRC=isSentPage?src.sents:(un.sents||[]);
  const words=(isSentPage?[]:(src.words||[])).map((w,i)=>'<div class="row selw'+(WT?' play':'')+'"><span class="n">'+(i+1)+'</span><span class="w">'+esc(w.w)+'</span><span class="m">'+esc(w.m)+'</span></div>').join('');
  const sents=SENTSRC.map((s,i)=>'<div class="srow'+(ST?' play':'')+'"><span class="sn">'+(i+1)+'</span><div class="sc"><span class="se">'+esc(s.e)+'</span><span class="sk">'+esc(s.k)+'</span></div></div>').join('');
  const pgtabs=PAGES?('<div class="pgrow">'+PAGES.map((p,i)=>{const sub=(p.sub!==undefined?p.sub:(p.p!=null?'p.'+p.p:''));return '<button class="pgtab'+(i===selP?' on':'')+'" type="button" data-pg="'+i+'"><b>'+esc(p.label||('세트 '+(i+1)))+'</b>'+(sub?'<span>'+esc(sub)+'</span>':'')+'</button>';}).join('')+'</div>'):'';
  const wordHead=PAGES?('교재 '+src.p+'쪽 순서 · '+(src.words||[]).length+'개'):('단어 '+(src.words?src.words.length:0)+'개');
  const wordHTML=(!isSentPage&&src.words&&src.words.length)?'<div class="rows">'+words+'</div>':'';
  const sentHead=(isSentPage?(esc(src.label||'문장읽기')+' · '):'')+'문장 '+SENTSRC.length+'개';
  const sentHTML=(SENTSRC.length)?'<div class="rows">'+sents+'</div>':'';
  const CNT={word:(isSentPage?0:(src.words||[]).length), sent:SENTSRC.length};
  const toggle= types.length>1 ? '<div class="atog" role="tablist" aria-label="음원 고르기">'+types.map((t,i)=>'<button class="atg'+(i===T0?' on':'')+'" type="button" role="tab" data-t="'+t.k+'">'+t.l+' 음원'+(CNT[t.k]?'<small>'+CNT[t.k]+'</small>':'')+'</button>').join('')+'</div>' : '';
  app.innerHTML='<div class="lview"><div class="lhead">'+cover(b)+'<div><button type="button" class="bk" data-go="book" data-book="'+b.code+'">'+esc(nm(b))+'</button>'+
    '<div class="un"><button type="button" id="uprev" aria-label="이전 유닛">‹</button><h1>Unit '+u+'</h1><button type="button" id="unext" aria-label="다음 유닛">›</button></div></div></div>'+
    '<audio id="au" preload="metadata"></audio>'+
    '<div class="dock" id="dock">'+toggle+pgtabs+
      '<div class="tbar" id="tbar"></div><div class="lhint" id="lhint" hidden></div>'+
      '<div class="pbar"><button class="pbtn" type="button" id="play" aria-label="재생"><span id="ico">▶</span></button>'+
      '<input type="range" id="seek" min="0" max="1000" value="0" aria-label="재생 위치"><span class="say" id="lbl"></span>'+
      '<button class="spdb" type="button" id="spd" aria-label="재생 속도">1.0×</button></div></div>'+
    ((wordHTML||sentHTML)? '<div class="wl" id="listbox"></div>':'')+
    teacherLine(b,u)+'</div>';
  const au=document.getElementById('au'); curAudio=au;
  const play=document.getElementById('play'), ico=document.getElementById('ico'), lbl=document.getElementById('lbl');
  const seek=document.getElementById('seek'), curEl={}, durEl={};   // 시간 숫자는 표시 안 함
  let curSpd=1, curT=(types.length?types[T0].k:'word');
  const listbox=document.getElementById('listbox');
  let hideMean=false, hideKo=false, repeatOn=false, shadowOn=false, curIdx=-1, boundEnd=null, shadowDone=-1, shadowHold=false, recHook=null;
  if(shadowTimer){ clearTimeout(shadowTimer); shadowTimer=null; } holdAfter=null;
  const hasKo=SENTSRC.some(s=>s.k);   // 해석/발음 있으면 토글 표시
  const koLabel=isSentPage?'발음':'해석';   // 파닉스 문장읽기는 '발음'
  function TIMES(){ return curT==='sent'?ST:(curT==='word'?WT:null); }
  function ROWSEL(){ return curT==='sent'?'.srow':'.row'; }
  function hintText(){ return (shadowOn&&curT==='sent')?'문장이 끝날 때마다 멈춰요. 그동안 소리 내어 따라 말해요':''; }
  function setHint(){ const lh=document.getElementById('lhint'); if(lh){ const t=hintText(); lh.textContent=t; lh.hidden=!t; } }
  function ctrlBar(){
    if(curT==='sent' && SENTSRC.length){
      let h='';
      if(hasKo) h+='<button class="lbtn'+(hideKo?' on':'')+'" type="button" id="tgKo">'+(hideKo?koLabel+' 보기':koLabel+' 숨기기')+'</button>';
      if(ST&&SE) h+='<button class="lbtn'+(shadowOn?' on':'')+'" type="button" id="tgSh">따라 말하기</button>';
      h+='<button class="lbtn recb" type="button" id="recOpen"><i></i>녹음</button>';
      return h;
    }
    if(curT==='word' && src.words && src.words.length){
      const mlab=PAGES?(hideMean?'소리 보기':'소리 숨기기'):(hideMean?'뜻 보기':'뜻 숨기기');
      return '<button class="lbtn'+(hideMean?' on':'')+'" type="button" id="tgMean">'+mlab+'</button><button class="lbtn recb" type="button" id="recOpen"><i></i>녹음</button>';
    }
    return '';
  }
  function highlight(follow){ if(!listbox) return; let el=null; listbox.querySelectorAll(ROWSEL()).forEach((r,i)=>{ r.classList.toggle('cur', i===curIdx); if(i===curIdx) el=r; });
    if(follow && el && !au.paused){ const r=el.getBoundingClientRect(); const dh=(document.getElementById('dock')||{}).offsetHeight||0; if(r.bottom>innerHeight-dh-10 || r.top<10) el.scrollIntoView({block:'center',behavior:'smooth'}); } }
  function bindList(){
    const km=document.getElementById('tgKo'); if(km) km.onclick=()=>{ hideKo=!hideKo; km.classList.toggle('on',hideKo); km.textContent=hideKo?koLabel+' 보기':koLabel+' 숨기기'; listbox.classList.toggle('hidek',hideKo); listbox.querySelectorAll('.srow.rv').forEach(r=>r.classList.remove('rv')); };
    const mm=document.getElementById('tgMean'); if(mm) mm.onclick=()=>{ hideMean=!hideMean; mm.classList.toggle('on',hideMean); mm.textContent=PAGES?(hideMean?'소리 보기':'소리 숨기기'):(hideMean?'뜻 보기':'뜻 숨기기'); listbox.classList.toggle('hidem',hideMean); listbox.querySelectorAll('.row.rv').forEach(r=>r.classList.remove('rv')); };
    const sh=document.getElementById('tgSh'); if(sh) sh.onclick=()=>{ shadowOn=!shadowOn; sh.classList.toggle('on',shadowOn); shadowDone=-1;
      if(!shadowOn && shadowTimer && shadowHold){ skipHold(); } setHint(); if(!au.paused) loopTick(); };
    const rp=document.getElementById('tgRep'); if(rp) rp.onclick=()=>{ repeatOn=!repeatOn; rp.classList.toggle('on',repeatOn); if(repeatOn) boundEnd=null; setHint(); if(!au.paused) loopTick(); };
    const ro=document.getElementById('recOpen'); if(ro) ro.onclick=()=>{ if(!au.paused) au.pause(); recGo(); };
    if(curT==='sent') listbox.querySelectorAll('.srow').forEach((r,i)=>r.onclick=()=>{ if(hideKo) r.classList.add('rv'); if(ST) playSeg(i); });
    if(curT==='word') listbox.querySelectorAll('.row').forEach((r,i)=>r.onclick=()=>{ if(hideMean) r.classList.toggle('rv'); if(WT) playSeg(i); });
  }
  function recGo(){ const sent=(curT==='sent'&&SENTSRC.length); const items=sent? SENTSRC.map(x=>({e:x.e,k:x.k})) : (src.words||[]).map(w=>({e:w.w,k:w.m}));
    openRec(b,u,items,sent?'문장':'단어',(PAGES&&src.p!=null)?'p.'+src.p:''); }
  function renderList(){ const tb=document.getElementById('tbar'); if(tb) tb.innerHTML=ctrlBar(); setHint(); if(!listbox) return; listbox.innerHTML=((curT==='sent'&&sentHTML)?sentHTML:(wordHTML||sentHTML));
    listbox.classList.toggle('hidem', curT==='word'&&hideMean); listbox.classList.toggle('hidek', curT==='sent'&&hideKo);
    bindList(); highlight(); }
  function playSeg(i){ const T=TIMES(); if(!T) return; if(shadowTimer){ clearTimeout(shadowTimer); shadowTimer=null; holdAfter=null; } shadowHold=false; shadowDone=-1; curIdx=i; highlight();
    const go=()=>{ boundEnd=repeatOn?null:1; try{au.currentTime=T[i];}catch(e){} au.playbackRate=curSpd; au.play(); };
    if(au.readyState>=1) go(); else au.addEventListener('loadedmetadata',go,{once:true}); }
  function loadSrc(){ au.src=A[curT]||''; try{au.load();}catch(e){} au.playbackRate=curSpd;
    ico.textContent='▶'; lbl.textContent=''; seek.value=0; curEl.textContent='0:00'; durEl.textContent='0:00'; curIdx=-1; boundEnd=null; renderList(); }
  play.onclick=()=>{ if(shadowTimer){ skipHold(); return; } shadowHold=false; if(au.paused){ boundEnd=null; au.play(); } else au.pause(); };
  const mk=()=>document.createElement('i'), mplay=mk(), mbar=mk(), mtm=mk();   // (옛 아래 재생 막대 자리 — 이제 조작판이 위에 붙음)
  const dock=document.getElementById('dock');
  if(stkIO) stkIO.disconnect(); if(miniIO) miniIO.disconnect();
  if(dock){ const pad=()=>{ document.body.style.paddingBottom=(dock.offsetHeight+8)+'px'; }; pad(); if('ResizeObserver' in window){ stkIO=new ResizeObserver(pad); stkIO.observe(dock); } }
  { const c=dock&&dock.querySelector('.pgtab.on'); if(c) c.scrollIntoView({inline:'center',block:'nearest'}); }
  au.onplay=()=>{ ico.textContent=shadowHold?'…':'❚❚'; lbl.textContent=shadowHold?'따라 말해요':''; mplay.textContent='❚❚'; loopTick(); };
  // 반복·따라 말하기·한 개 듣기 — 조합 규칙
  //  반복만: 지금 항목 끝 → (문장은 0.6초 쉬고) 처음으로  / 따라 말하기만: 문장 끝 → 문장 길이+0.8초 멈춤(음원 속 쉼 포함) → 다음
  //  둘 다: 문장 끝 → 문장 길이+0.8초 멈춤 → 같은 문장 처음  / 항목을 누르면: 반복 켜짐=그 항목 반복, 꺼짐=그 항목 한 번
  function segEnd(k){ const T=TIMES(); return (curT==='sent'&&SE)? SE[k] : (T[k+1]!=null? T[k+1]-0.05 : (au.duration||1e9)-0.05); }
  function hold(ms, after, say){ shadowHold=!!say; holdAfter=after; if(say&&recHook) recHook('say'); au.pause(); shadowTimer=setTimeout(()=>{ shadowTimer=null; const f=holdAfter; holdAfter=null; if(f) f(); }, ms); }
  function skipHold(){ clearTimeout(shadowTimer); shadowTimer=null; const f=holdAfter; holdAfter=null; if(f) f(); else au.play(); }
  function tick(){ const T=TIMES(); if(!T||au.paused||shadowTimer) return; const t=au.currentTime;
    if(curIdx>=0 && (repeatOn||boundEnd!=null)){
      const k=curIdx; if(t<segEnd(k)) return;
      if(!repeatOn){ boundEnd=null; au.pause(); return; }
      const again=()=>{ if(repeatOn){ try{au.currentTime=T[k];}catch(e){} } shadowHold=false; au.play(); };
      if(curT==='sent') hold((shadowOn&&SE? Math.max(0.6,(SE[k]-ST[k])+0.8) : 0.6)*1000/curSpd, again, shadowOn&&SE);
      else { try{au.currentTime=T[k];}catch(e){} }
      return; }
    let idx=0; for(let j=0;j<T.length;j++){ if(t>=T[j]-0.02) idx=j; }
    if(idx!==curIdx){ curIdx=idx; highlight(true); shadowDone=-1; if(recHook) recHook(idx); if(shadowHold){ shadowHold=false; ico.textContent='❚❚'; lbl.textContent=''; } }
    if(shadowOn&&curT==='sent'&&SE&&curIdx>=0&&shadowDone!==curIdx&&t>=SE[curIdx]){ const k=curIdx; shadowDone=k; const gap=(ST[k+1]!=null?ST[k+1]-SE[k]:0);
      hold(Math.max(0.6,(SE[k]-ST[k])+0.8-gap)*1000/curSpd, ()=>au.play(), true); } }
  function loopTick(){ tick(); if(!au.paused && (shadowOn||repeatOn||boundEnd!=null)) requestAnimationFrame(loopTick); }
  au.onpause=()=>{ mplay.textContent='▶'; if(!au.ended){ ico.textContent=shadowHold?'…':(shadowTimer?'❚❚':'▶'); lbl.textContent=shadowHold?'따라 말해요':''; } };
  au.onended=()=>{ if(recHook) recHook('end'); ico.textContent='↺'; lbl.textContent=''; mplay.textContent='↺'; curIdx=-1; highlight(); };
  au.ontimeupdate=()=>{ if(au.duration){ seek.value=Math.round(au.currentTime/au.duration*1000); curEl.textContent=fmt(au.currentTime); mbar.style.width=(au.currentTime/au.duration*100)+'%'; mtm.textContent=fmt(au.currentTime);}
    tick(); };
  au.onloadedmetadata=()=>durEl.textContent=fmt(au.duration);
  seek.oninput=()=>{ if(au.duration){ if(shadowTimer){ clearTimeout(shadowTimer); shadowTimer=null; holdAfter=null; shadowHold=false; } boundEnd=null; shadowDone=-1; curIdx=-1; au.currentTime=seek.value/1000*au.duration; } };
  const spdB=document.getElementById('spd'); spdB.onclick=()=>{ curSpd=curSpd===1?1.2:(curSpd===1.2?0.8:1); au.playbackRate=curSpd; spdB.textContent=curSpd.toFixed(1)+'×'; spdB.classList.toggle('on',curSpd!==1); };
  document.querySelectorAll('.atg').forEach(x=>x.onclick=()=>{ curT=x.dataset.t;
    document.querySelectorAll('.atg').forEach(y=>y.classList.remove('on')); x.classList.add('on'); loadSrc(); });
  loadSrc();
  document.querySelectorAll('.pgtab').forEach(x=>x.onclick=()=>{ const pi=parseInt(x.dataset.pg); if(pi===selP)return; if(curAudio){curAudio.pause();curAudio=null;} leaf(b,u,pi); window.scrollTo(0,0); });
  { const rq=new URLSearchParams(location.search).get('rec'); if(listbox && rq){ const q=new URL(location.href); q.searchParams.delete('rec'); history.replaceState(history.state,'',q.toString());
      const want=(rq==='s'?'sent':(rq==='w'?'word':curT)); if(want!==curT){ const a=document.querySelector('.atg[data-t="'+want+'"]'); if(a) a.click(); } recGo(); } }
  const prev=document.getElementById('uprev'), next=document.getElementById('unext');
  prev.disabled=(u<=1); next.disabled=(u>=b.units.length);
  prev.onclick=()=>{ if(u>1) go({book:b.code,u:u-1}); };
  next.onclick=()=>{ if(u<b.units.length) go({book:b.code,u:u+1}); };
}

app.addEventListener('click', e=>{
  const t=e.target.closest('[data-go]'); if(!t) return; const g=t.dataset.go;
  if(g==='home') go({});
  else if(g==='book') go({book:t.dataset.book});
  else if(g==='lec') go({book:t.dataset.book, tab:'lec'});
  else if(g==='leaf') go({book:t.dataset.book, u:parseInt(t.dataset.u)});
});
render();
</script>

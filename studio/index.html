<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>쏠뷰 · 저절로 자료</title>
<style>
  :root{
    --ink:#16233a; --sub:#5b6b85; --card:#ffffff; --line:#e2e8f4;
    --blue:#2f6bed; --blue2:#3f6fe0; --blue-soft:#e5edff; --blue-ink:#245ad6;
    --shadow:0 1px 2px rgba(22,35,58,.05), 0 10px 30px -12px rgba(47,107,237,.28);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; }
  body{ font-family:"Pretendard","Malgun Gothic","맑은 고딕",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink); -webkit-text-size-adjust:100%; line-height:1.5; -webkit-tap-highlight-color:transparent;
    background:radial-gradient(120% 70% at 50% -8%, #eaf1ff 0%, #f5f8ff 42%, #eef2f9 100%) fixed; }
  .wrap{ max-width:560px; margin:0 auto; padding:18px 16px 52px; }

  .topbar{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .chipbtn{ border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px;
    padding:8px 14px; font:inherit; font-weight:700; font-size:13.5px; cursor:pointer; box-shadow:var(--shadow); }
  .nav{ margin-left:auto; display:flex; gap:6px; }
  .nav button{ border:1px solid var(--line); background:var(--card); color:var(--blue2); border-radius:999px;
    padding:8px 13px; font:inherit; font-weight:800; font-size:13.5px; cursor:pointer; box-shadow:var(--shadow); }
  .nav button:disabled{ opacity:.4; color:var(--sub); cursor:default; }

  .kicker{ display:inline-block; font-size:12px; font-weight:800; letter-spacing:.1em;
    color:var(--blue2); background:var(--blue-soft); border-radius:999px; padding:6px 13px; }
  h1{ font-size:23px; font-weight:800; letter-spacing:-.02em; margin:10px 0 0; }
  .unit{ display:inline-block; margin-top:9px; background:var(--blue-soft); color:var(--blue-ink);
    font-weight:800; font-size:15px; padding:5px 13px; border-radius:999px; }
  .head{ margin-bottom:18px; }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  .bookcard{ display:flex; flex-direction:column; justify-content:space-between; min-height:96px; text-align:left;
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:15px; box-shadow:var(--shadow);
    font:inherit; color:var(--ink); cursor:pointer; }
  .bookcard .bk{ font-size:15px; font-weight:800; line-height:1.35; }
  .bookcard .go{ color:var(--blue2); font-weight:800; font-size:13px; margin-top:10px; }
  .bookcard.off{ opacity:.55; cursor:default; box-shadow:none; background:#f7f9fd; }
  .bookcard.off .soon{ color:var(--sub); font-weight:700; font-size:12px; margin-top:10px; }

  .unitcard{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:13px; box-shadow:var(--shadow); }
  .unitcard .ut{ font-size:15px; font-weight:800; margin-bottom:10px; }
  .ubtns{ display:flex; flex-direction:column; gap:7px; }
  .ubtn{ display:flex; align-items:center; justify-content:center; gap:6px; text-decoration:none;
    border:0; border-radius:11px; padding:11px 0; font:inherit; font-weight:800; font-size:13.5px; cursor:pointer; }
  .ubtn.audio{ background:linear-gradient(160deg,#5b93ff,#2f6bed 70%); color:#fff; box-shadow:0 8px 18px -8px rgba(47,107,237,.6); }
  .ubtn.video{ background:var(--card); border:1px solid var(--line); color:var(--blue2); }
  .ubtn.off{ background:#eef2f9; color:var(--sub); cursor:default; }

  /* leaf player */
  .player{ text-align:center; padding:14px 6px 6px; }
  .btnwrap{ position:relative; display:inline-block; }
  .btnwrap::before{ content:""; position:absolute; inset:-16px; border-radius:50%;
    background:radial-gradient(closest-side,rgba(63,111,224,.26),transparent); filter:blur(6px); }
  .playbig{ position:relative; width:148px; height:148px; border-radius:50%; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    background:linear-gradient(160deg,#5b93ff 0%,#2f6bed 60%,#245ad6 100%); color:#fff;
    box-shadow:0 18px 40px -10px rgba(47,107,237,.6),inset 0 2px 3px rgba(255,255,255,.35);
    transition:transform .1s ease; user-select:none; }
  .playbig:active{ transform:scale(.96); }
  .playbig .ico{ font-size:46px; line-height:1; } .playbig .lbl{ font-size:14px; font-weight:800; letter-spacing:.02em; }
  .seekwrap{ max-width:340px; margin:22px auto 0; }
  input[type=range]{ width:100%; accent-color:var(--blue); height:20px; }
  .time{ display:flex; justify-content:space-between; font-size:12px; color:var(--sub); }
  .spds{ display:flex; gap:8px; justify-content:center; margin-top:16px; }
  .spd{ border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px;
    padding:8px 16px; font:inherit; font-size:14px; font-weight:800; cursor:pointer; }
  .spd.on{ background:var(--blue-soft); color:var(--blue-ink); border-color:transparent; }
  .bigres{ display:flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; margin-bottom:14px;
    background:linear-gradient(160deg,#5b93ff,#2f6bed 70%); color:#fff; border-radius:14px; padding:16px; font-weight:800; font-size:16px; box-shadow:0 10px 24px -10px rgba(47,107,237,.6); }
  .atog{ display:inline-flex; gap:4px; background:#e9eefb; border-radius:999px; padding:4px; margin-bottom:18px; }
  .atg{ border:0; background:transparent; color:var(--sub); font:inherit; font-weight:800; font-size:14px; padding:8px 20px; border-radius:999px; cursor:pointer; }
  .atg.on{ background:#fff; color:var(--blue-ink); box-shadow:0 1px 3px rgba(47,107,237,.25); }
  .srow{ display:flex; align-items:baseline; gap:10px; padding:11px 4px; border-bottom:1px solid var(--line); }
  .srow:last-child{ border-bottom:0; }
  .srow .sn{ width:20px; color:var(--blue2); font-size:12px; font-weight:800; flex:none; text-align:right; }
  .srow .sc{ display:flex; flex-direction:column; gap:3px; }
  .srow .se{ font-weight:800; color:var(--ink); font-size:17px; }
  .srow .sk{ color:var(--sub); font-size:14px; }
  .srow.play{ cursor:pointer; }
  .srow.cur{ background:var(--blue-soft); border-radius:10px; }
  .wl.hidek .srow .sk{ visibility:hidden; }
  .wl.hidek .srow.rv .sk{ visibility:visible; }
  .wl.hidem .row .m{ visibility:hidden; }
  .wl.hidem .row.rv .m{ visibility:visible; }
  .row.selw{ cursor:pointer; }
  .lctrl{ display:flex; gap:8px; margin:0 0 10px; flex-wrap:wrap; }
  .lbtn{ border:1px solid var(--line); background:var(--card); color:var(--sub); font:inherit; font-weight:700; font-size:13px; padding:6px 12px; border-radius:999px; cursor:pointer; }
  .lbtn.on{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .lhint{ color:var(--sub); font-size:12.5px; margin:-4px 0 10px; }
  .orientbox{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:var(--shadow); margin-bottom:14px; }
  .orienth{ font-size:14px; font-weight:800; margin:0 0 10px; color:var(--blue-ink); }
  .orientgrid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .orient{ display:flex; align-items:center; justify-content:center; gap:5px; text-decoration:none;
    background:var(--blue-soft); color:var(--blue-ink); border-radius:10px; padding:12px 6px; font-weight:800; font-size:13px; }
  @media (min-width:820px){ .orientgrid{ grid-template-columns:repeat(5,1fr); } }

  .wl{ margin-top:26px; }
  .wl h2{ font-size:13px; color:var(--sub); font-weight:800; margin:0 0 6px; }
  .rows{ display:grid; grid-template-columns:1fr; }
  .row{ display:flex; align-items:baseline; gap:10px; padding:11px 4px; border-bottom:1px solid var(--line); }
  .row .n{ width:20px; color:var(--blue2); font-size:12px; font-weight:800; flex:none; text-align:right; }
  .row .w{ font-size:18px; font-weight:800; }
  .row .m{ color:var(--sub); font-size:15px; margin-left:auto; text-align:right; }

  .brand{ margin-top:30px; text-align:center; font-size:12.5px; font-weight:600; letter-spacing:.05em; color:#8a97ad; }
  .brand b{ color:var(--blue2); }

  @media (min-width:820px){
    .wrap{ max-width:900px; padding:26px; }
    h1{ font-size:30px; }
    .grid{ grid-template-columns:1fr 1fr 1fr; }
    .playbig{ width:184px; height:184px; } .playbig .ico{ font-size:58px; }
    .spd{ font-size:17px; padding:10px 22px; }
    .rows{ grid-template-columns:1fr 1fr; column-gap:40px; }
    .row .w{ font-size:22px; } .row .m{ font-size:18px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>document.write('<scr'+'ipt src="data_books.js?v='+Date.now()+'"><\/scr'+'ipt>');</script>
<script>
const BOOKS = window.BOOKS||[];
const app = document.getElementById('app');
let curAudio=null;
const BRANDLINE='<p class="brand"><b>쏠뷰</b> &nbsp;|&nbsp; 저절로그래머 &amp; 라이팅</p>';

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function bookByCode(c){ return BOOKS.find(b=>b.code===c); }
function parse(){ const q=new URLSearchParams(location.search); let book=q.get('book'), u=parseInt(q.get('u'));
  const c=q.get('c'); if(c){ const m=c.match(/^([a-z]+\d+)u(\d+)/i); if(m){ book=book||m[1]; if(!u)u=parseInt(m[2]); } }
  return {book, u:(u>=1?u:null)}; }
function go(params, push){ const qs=new URLSearchParams();
  if(params.book) qs.set('book',params.book); if(params.u) qs.set('u',params.u);
  const url=location.pathname+(qs.toString()?'?'+qs.toString():'');
  if(push!==false) history.pushState(params,'',url); render(); }
window.addEventListener('popstate', render);

function render(){
  if(curAudio){ curAudio.pause(); curAudio=null; } window.scrollTo(0,0);
  const {book,u}=parse(); const b=book?bookByCode(book):null;
  if(b && u && b.units[u-1]) return leaf(b,u);
  if(b) return bookView(b); return home();
}

function home(){
  document.title='쏠뷰 · 저절로 자료';
  const cards=BOOKS.map(b=> b.active
    ? '<button class="bookcard" data-go="book" data-book="'+b.code+'"><span class="bk">'+esc(b.short)+'</span><span class="go">열기 ›</span></button>'
    : '<div class="bookcard off"><span class="bk">'+esc(b.short)+'</span><span class="soon">준비중</span></div>'
  ).join('');
  app.innerHTML='<div class="head"><span class="kicker">쏠뷰</span><h1>교재 선택</h1></div><div class="grid">'+cards+'</div>'+BRANDLINE;
}

function bookView(b){
  document.title=b.short;
  let top='';
  const vids=(b.book_resources||[]).filter(r=>r.type==='video'&&r.url);
  if(vids.length){
    const chips=vids.map(r=>'<a class="orient" href="'+esc(r.url)+'" target="_blank" rel="noopener">▶ '+esc(r.label||'영상')+'</a>').join('');
    top='<div class="orientbox"><h2 class="orienth">🎬 '+esc(b.orient_title||'오리엔테이션 영상')+'</h2><div class="orientgrid">'+chips+'</div></div>';
  }
  const cards=b.units.map(un=>{
    const hasA=un.audio&&(un.audio.word||un.audio.sent);
    const a=hasA? '<button class="ubtn audio" data-go="leaf" data-book="'+b.code+'" data-u="'+un.n+'">🔊 음원 듣기</button>'
                : '<span class="ubtn off">🔊 준비중</span>';
    const vid=un.video? '<a class="ubtn video" href="'+esc(un.video)+'" target="_blank" rel="noopener">🎬 강의 영상</a>':'';
    return '<div class="unitcard"><div class="ut">Unit '+un.n+'</div><div class="ubtns">'+a+vid+'</div></div>';
  }).join('');
  app.innerHTML='<div class="topbar"><button class="chipbtn" data-go="home">← 교재 목록</button></div>'+
    '<div class="head"><span class="kicker">'+esc(b.short)+'</span><h1>유닛 선택</h1></div>'+
    top+'<div class="grid">'+cards+'</div>'+BRANDLINE;
}

function fmt(s){ s=Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function leaf(b,u){
  const un=b.units[u-1]; document.title=b.short+' · Unit '+u;
  const A=un.audio||{};
  const types=[]; if(A.word)types.push({k:'word',l:'단어'}); if(A.sent)types.push({k:'sent',l:'문장'});
  const ST=un.st||null;  // 문장 시작시각(있으면 탭재생/하이라이트/반복 활성)
  const words=(un.words||[]).map((w,i)=>'<div class="row selw"><span class="n">'+(i+1)+'</span><span class="w">'+esc(w.w)+'</span><span class="m">'+esc(w.m)+'</span></div>').join('');
  const sents=(un.sents||[]).map((s,i)=>'<div class="srow'+(ST?' play':'')+'"><span class="sn">'+(i+1)+'</span><div class="sc"><span class="se">'+esc(s.e)+'</span><span class="sk">'+esc(s.k)+'</span></div></div>').join('');
  const wordHTML=(un.words&&un.words.length)?'<h2>단어 '+un.words.length+'개</h2><div class="rows">'+words+'</div>':'';
  const sentHTML=(un.sents&&un.sents.length)?'<h2>문장 '+un.sents.length+'개</h2><div class="rows">'+sents+'</div>':'';
  const toggle= types.length>1 ? '<div class="atog">'+types.map((t,i)=>'<button class="atg'+(i===0?' on':'')+'" data-t="'+t.k+'">'+t.l+' 음원</button>').join('')+'</div>' : '';
  app.innerHTML='<div class="topbar"><button class="chipbtn" data-go="book" data-book="'+b.code+'">← 유닛 목록</button>'+
    '<div class="nav"><button id="uprev">◀ 이전</button><button id="unext">다음 ▶</button></div></div>'+
    '<div class="head"><span class="kicker">'+esc(b.short)+'</span><div class="unit">Unit '+u+'</div></div>'+
    '<div class="player"><audio id="au" preload="metadata"></audio>'+toggle+
      '<div class="btnwrap"><button class="playbig" id="play" aria-label="재생"><span class="ico" id="ico">▶</span><span class="lbl" id="lbl">듣기</span></button></div>'+
      '<div class="seekwrap"><input type="range" id="seek" min="0" max="1000" value="0" aria-label="재생 위치">'+
      '<div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div></div>'+
      '<div class="spds"><button class="spd" data-s="0.8">0.8×</button><button class="spd on" data-s="1">1.0×</button><button class="spd" data-s="1.2">1.2×</button></div>'+
    '</div>'+
    ((wordHTML||sentHTML)? '<div class="wl" id="listbox"></div>':'')+BRANDLINE;

  const au=document.getElementById('au'); curAudio=au;
  const play=document.getElementById('play'), ico=document.getElementById('ico'), lbl=document.getElementById('lbl');
  const seek=document.getElementById('seek'), curEl=document.getElementById('cur'), durEl=document.getElementById('dur');
  let curSpd=1, curT=(types.length?types[0].k:'word');
  const listbox=document.getElementById('listbox');
  let hideMean=false, hideKo=false, repeatOn=false, curIdx=-1, boundEnd=null;
  function ctrlBar(){
    if(curT==='sent' && un.sents && un.sents.length){
      let h='<div class="lctrl"><button class="lbtn'+(hideKo?' on':'')+'" id="tgKo">'+(hideKo?'해석 보기':'해석 숨기기')+'</button>';
      if(ST) h+='<button class="lbtn'+(repeatOn?' on':'')+'" id="tgRep">🔁 한 문장 반복</button>';
      h+='</div>';
      if(ST) h+='<div class="lhint" id="lhint">'+(repeatOn?'반복 켜짐 — 문장을 누르면 그 문장만 계속 반복돼요 (멈추려면 재생버튼)':'문장을 누르면 그 문장만 재생돼요')+'</div>';
      return h;
    }
    if(curT==='word' && un.words && un.words.length)
      return '<div class="lctrl"><button class="lbtn'+(hideMean?' on':'')+'" id="tgMean">'+(hideMean?'뜻 보기':'뜻 숨기기')+'</button></div>';
    return '';
  }
  function highlight(){ if(listbox) listbox.querySelectorAll('.srow').forEach((r,i)=>r.classList.toggle('cur', i===curIdx)); }
  function bindList(){
    const km=document.getElementById('tgKo'); if(km) km.onclick=()=>{ hideKo=!hideKo; km.classList.toggle('on',hideKo); km.textContent=hideKo?'해석 보기':'해석 숨기기'; listbox.classList.toggle('hidek',hideKo); listbox.querySelectorAll('.srow.rv').forEach(r=>r.classList.remove('rv')); };
    const mm=document.getElementById('tgMean'); if(mm) mm.onclick=()=>{ hideMean=!hideMean; mm.classList.toggle('on',hideMean); mm.textContent=hideMean?'뜻 보기':'뜻 숨기기'; listbox.classList.toggle('hidem',hideMean); listbox.querySelectorAll('.row.rv').forEach(r=>r.classList.remove('rv')); };
    const rp=document.getElementById('tgRep'); if(rp) rp.onclick=()=>{ repeatOn=!repeatOn; rp.classList.toggle('on',repeatOn); const lh=document.getElementById('lhint'); if(lh) lh.textContent=repeatOn?'반복 켜짐 — 문장을 누르면 그 문장만 계속 반복돼요 (멈추려면 재생버튼)':'문장을 누르면 그 문장만 재생돼요'; };
    if(curT==='sent') listbox.querySelectorAll('.srow').forEach((r,i)=>r.onclick=()=>{ if(hideKo) r.classList.add('rv'); if(ST) playSent(i); });
    if(curT==='word') listbox.querySelectorAll('.row').forEach(r=>r.onclick=()=>{ if(hideMean) r.classList.toggle('rv'); });
  }
  function renderList(){ if(!listbox) return; listbox.innerHTML=ctrlBar()+((curT==='sent'&&sentHTML)?sentHTML:(wordHTML||sentHTML));
    listbox.classList.toggle('hidem', curT==='word'&&hideMean); listbox.classList.toggle('hidek', curT==='sent'&&hideKo);
    bindList(); highlight(); }
  function playSent(i){ curIdx=i; highlight();
    const go=()=>{ boundEnd=(ST[i+1]!=null?ST[i+1]:(au.duration||1e9)); try{au.currentTime=ST[i];}catch(e){} au.playbackRate=curSpd; au.play(); };
    if(au.readyState>=1) go(); else au.addEventListener('loadedmetadata',go,{once:true}); }
  function loadSrc(){ au.src=A[curT]||''; try{au.load();}catch(e){} au.playbackRate=curSpd;
    ico.textContent='▶'; lbl.textContent='듣기'; seek.value=0; curEl.textContent='0:00'; durEl.textContent='0:00'; curIdx=-1; boundEnd=null; renderList(); }
  play.onclick=()=>{ if(au.paused){ boundEnd=null; au.play(); } else au.pause(); };
  au.onplay=()=>{ ico.textContent='⏸'; lbl.textContent='듣는 중'; };
  au.onpause=()=>{ if(!au.ended){ ico.textContent='▶'; lbl.textContent='계속 듣기'; } };
  au.onended=()=>{ ico.textContent='↺'; lbl.textContent='다시 듣기'; curIdx=-1; highlight(); };
  au.ontimeupdate=()=>{ if(au.duration){ seek.value=Math.round(au.currentTime/au.duration*1000); curEl.textContent=fmt(au.currentTime);}
    if(curT==='sent'&&ST){
      if(boundEnd!=null){ if(au.currentTime>=boundEnd-0.04){ if(repeatOn){ au.currentTime=ST[curIdx]; } else { au.pause(); boundEnd=null; } } }
      else { let idx=0; for(let j=0;j<ST.length;j++){ if(au.currentTime>=ST[j]-0.02) idx=j; } if(idx!==curIdx){ curIdx=idx; highlight(); } }
    } };
  au.onloadedmetadata=()=>durEl.textContent=fmt(au.duration);
  seek.oninput=()=>{ if(au.duration){ boundEnd=null; au.currentTime=seek.value/1000*au.duration; } };
  document.querySelectorAll('.spd').forEach(x=>x.onclick=()=>{ curSpd=parseFloat(x.dataset.s); au.playbackRate=curSpd;
    document.querySelectorAll('.spd').forEach(y=>y.classList.remove('on')); x.classList.add('on'); });
  document.querySelectorAll('.atg').forEach(x=>x.onclick=()=>{ curT=x.dataset.t;
    document.querySelectorAll('.atg').forEach(y=>y.classList.remove('on')); x.classList.add('on'); loadSrc(); });
  loadSrc();
  const prev=document.getElementById('uprev'), next=document.getElementById('unext');
  prev.disabled=(u<=1); next.disabled=(u>=b.units.length);
  prev.onclick=()=>{ if(u>1) go({book:b.code,u:u-1}); };
  next.onclick=()=>{ if(u<b.units.length) go({book:b.code,u:u+1}); };
}

app.addEventListener('click', e=>{
  const t=e.target.closest('[data-go]'); if(!t) return; const g=t.dataset.go;
  if(g==='home') go({});
  else if(g==='book') go({book:t.dataset.book});
  else if(g==='leaf') go({book:t.dataset.book, u:parseInt(t.dataset.u)});
});
render();
</script>
</body>
</html>

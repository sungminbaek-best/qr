<style>
.st{max-width:1160px;margin:0 auto;padding:44px 24px 24px;min-height:60vh}
.st h1{font-size:clamp(30px,4.4vw,46px);font-weight:800;letter-spacing:-.05em;line-height:1.15}

@media(max-width:860px){.bgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

.ubtns{flex:1;display:flex;flex-direction:column;gap:6px}
.ubtns a.ubtn:first-child{margin-top:auto}  /* 음원 없이 강의만 있는 유닛: 강의는 늘 아래 칸 */
.ubtn{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;padding:10px 0;font-size:13.5px;font-weight:700;border:1px solid var(--line2);background:#fff;color:var(--ink);text-align:center;transition:background .15s,color .15s,border-color .15s}

@media(max-width:860px){.ugrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

.player{text-align:center;padding:26px 6px 6px}

.pgtabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 4px}

.row .w{font-size:20px;font-weight:800;letter-spacing:-.02em}

.row.play,.srow.play,.row.selw{cursor:pointer}
.row.cur,.srow.cur{background:var(--soft);border-radius:10px;box-shadow:inset 3px 0 0 var(--brand)}
.row.cur .w,.srow.cur .se,.row.cur .n,.srow.cur .sn{color:var(--brand)}
.wl.hidek .srow .sk{visibility:hidden}.wl.hidek .srow.rv .sk{visibility:visible}
.wl.hidem .row .m{visibility:hidden}.wl.hidem .row.rv .m{visibility:visible}
.lctrl{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.lbtn{border:1px solid var(--line2);background:#fff;color:var(--sub);font-weight:700;font-size:13px;padding:6px 12px;border-radius:9px}
.lbtn.on{background:var(--soft);color:var(--brand);border-color:var(--brand)}
.tline{display:flex;align-items:center;gap:10px;margin:40px auto 0;max-width:520px;padding:14px 18px;border:1px dashed var(--line2);border-radius:14px;font-size:14px;color:var(--sub);transition:border-color .15s}
.tline b{color:var(--ink);font-weight:800}.tline i{margin-left:auto;font-style:normal;color:var(--brand);font-weight:700}
.tline:hover{border-color:var(--brand)}
@media(max-width:600px){.tline{flex-wrap:wrap;gap:2px 8px}.tline span{order:3;width:100%}}
/* 아래로 내리면 따라오는 작은 재생 막대 */
.mini{position:fixed;left:50%;bottom:16px;z-index:40;width:min(560px,calc(100% - 24px));display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;box-shadow:0 18px 40px -18px rgba(12,16,32,.4);transform:translate(-50%,140%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.mini.on{transform:translate(-50%,0)}
.mini button{flex:none;width:42px;height:42px;border-radius:50%;background:var(--grad);color:#fff;font-size:15px;display:grid;place-items:center}
.mini .mt{flex:1;min-width:0}
.mini .mt b{display:block;font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .bar{height:4px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}.mini .bar i{display:block;height:100%;width:0;background:var(--grad)}
.mini .tm{flex:none;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.lhint{color:var(--mute);font-size:12.5px;margin:-4px 0 10px}

@media(max-width:700px){.st{padding:28px 18px 16px}.rows{grid-template-columns:1fr}.row .w{font-size:18px}.row .m{font-size:15px}}

<script>
const BOOKS = window.BOOKS||[];
const NAME = {"ph1": "저절로 파닉스 1", "ph2": "저절로 파닉스 2", "rst1": "저절로 스타터 1", "rst2": "저절로 스타터 2", "rbr1": "저절로 브릿지 1", "rbr2": "저절로 브릿지 2", "rin1": "저절로 입문 1", "rin2": "저절로 입문 2", "rba1": "저절로 기본 1", "rba2": "저절로 기본 2", "rmo1": "저절로 첫모의고사 1", "rmo2": "저절로 첫모의고사 2", "gw1": "저절로 그래머&라이팅 1", "gw2": "저절로 그래머&라이팅 2"}, SLUG = {"ph": "phonics", "rst": "starter", "rbr": "bridge", "rin": "intro", "rba": "basic", "rmo": "mock", "gw": "grammar"}, STEPL = {"ph1": "1단계 · 파닉스", "ph2": "1단계 · 파닉스", "rst1": "2단계 · 스타터", "rst2": "2단계 · 스타터", "rbr1": "3단계 · 브릿지", "rbr2": "3단계 · 브릿지", "rin1": "4단계 · 입문", "rin2": "4단계 · 입문", "rba1": "5단계 · 기본", "rba2": "5단계 · 기본", "rmo1": "6단계 · 첫모의고사", "rmo2": "6단계 · 첫모의고사", "gw1": "문법·쓰기", "gw2": "문법·쓰기"};
const app = document.getElementById('app');
let curAudio=null;
function nm(b){ return NAME[b.code]||b.short; }
function slugOf(c){ return SLUG[c.replace(/\d+$/,'')]||''; }
function cover(b){ return '<img src="/assets/covers/'+b.code+'.webp" alt=""'+(b.code.indexOf('gw')===0?' class="land"':'')+'>'; }
/* 책별 전체 데이터(단어·문장·시각)는 필요할 때 그 책 것만 받음 */
function loadFull(b, cb){
  const put=()=>{ const f=(window.__BOOKFULL||{})[b.code]; if(f){ b.units=f; b._full=true; } cb(); };
  if((window.__BOOKFULL||{})[b.code]) return put();
  app.innerHTML='<p class="msg">불러오는 중…</p>';
  const s=document.createElement('script');
  s.src='/studio/data/'+b.code+'.js?v='+((window.BOOKVER||{})[b.code]||'');
  s.onload=put;
  s.onerror=()=>{ app.innerHTML='<p class="msg">연결이 불안정해요. 새로고침해 주세요.</p>'; };
  document.head.appendChild(s);
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function bookByCode(c){ return BOOKS.find(b=>b.code===c); }
function parse(){ const q=new URLSearchParams(location.search); let book=q.get('book'), u=parseInt(q.get('u'));
  const c=q.get('c'); if(c){ const m=c.match(/^([a-z]+\d+)u(\d+)/i); if(m){ book=book||m[1]; if(!u)u=parseInt(m[2]); } }
  return {book, u:(u>=1?u:null)}; }
function go(params, push){ const qs=new URLSearchParams();
  if(params.book) qs.set('book',params.book); if(params.u) qs.set('u',params.u);
  const url=location.pathname+(qs.toString()?'?'+qs.toString():'');
  if(push!==false) history.pushState(params,'',url); render(); }
window.addEventListener('popstate', render);

function render(){
  if(curAudio){ curAudio.pause(); curAudio=null; } window.scrollTo(0,0);
  const {book,u}=parse(); const b=book?bookByCode(book):null;
  if(b && u && b.units[u-1]) return b._full ? leaf(b,u) : loadFull(b,()=>{ const p=parse(); if(p.book===b.code && p.u===u) leaf(b,u); });
  if(b) return bookView(b); return home();
}

function home(){
  document.title='음원·강의 · 쏠뷰';
  const card=(b)=>{
    const sub=STEPL[b.code]||(b.track==='grammar'?'문법·쓰기':(b.step+'단계'));
    const inner=cover(b)+'<span class="t"><b>'+esc(nm(b))+'</b><small>'+sub+'</small></span>';
    return b.active ? '<button class="bcard" type="button" data-go="book" data-book="'+b.code+'">'+inner+'</button>'
                    : '<div class="bcard off">'+inner+'</div>';
  };
  const reading=BOOKS.filter(b=>b.track!=='grammar').map(card).join('');
  const grammar=BOOKS.filter(b=>b.track==='grammar').map(card).join('');
  app.innerHTML='<h1>음원·강의</h1><p class="lead">책의 QR로 듣던 단어·문장 음원과 강의예요. 교재를 고르면 유닛별로 열 수 있어요.</p>'+
    '<h2 class="gh">읽기 <span>파닉스에서 첫모의고사까지</span></h2><div class="bgrid">'+reading+'</div>'+
    (grammar?'<h2 class="gh">문법·쓰기</h2><div class="bgrid">'+grammar+'</div>':'');
}

function bookView(b){
  document.title=nm(b)+' 음원·강의 · 쏠뷰';
  let top='';
  const vids=(b.book_resources||[]).filter(r=>r.type==='video'&&r.url);
  if(vids.length){
    const chips=vids.map(r=>'<a class="orient" href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.label||'영상')+' ↗</a>').join('');
    top='<div class="orientbox"><h2>'+esc(b.orient_title||'오리엔테이션 영상')+'</h2><div class="orientgrid">'+chips+'</div></div>';
  }
  const cards=b.units.map(un=>{
    const hasA=(un.audio&&(un.audio.word||un.audio.sent))||(un.pages&&un.pages.length)||un.np;
    const vlist=(un.videos&&un.videos.length)? un.videos : (un.video? [{label:'강의 영상',url:un.video}] : []);
    const a=hasA? '<button class="ubtn main" type="button" data-go="leaf" data-book="'+b.code+'" data-u="'+un.n+'">'+IC_HP+'음원 듣기</button>'
                : (vlist.length? '' : '<span class="ubtn off">준비 중</span>');
    const vid=vlist.map(v=>'<a class="ubtn" href="'+esc(v.url)+'" target="_blank" rel="noopener">'+IC_PL+esc(v.label)+' ↗</a>').join('');
    return '<div class="ucard"><div class="ut">Unit '+un.n+'</div><div class="ubtns">'+a+vid+'</div></div>';
  }).join('');
  const sl=slugOf(b.code);
  app.innerHTML='<nav class="crumb" aria-label="위치"><button type="button" data-go="home">음원·강의</button><span>›</span><span>'+esc(nm(b))+'</span></nav>'+
    '<div class="bhead">'+cover(b)+'<div class="tx"><h1>'+esc(nm(b))+'</h1></div>'+(sl?'<a class="btn line sm" href="/books/'+sl+'/">교재 소개 →</a>':'')+'</div>'+
    top+'<div class="ugrid">'+cards+'</div>';
}

const IC_HP='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="5" height="7" rx="2" fill="currentColor"/><rect x="16" y="14" width="5" height="7" rx="2" fill="currentColor"/></svg>';
const IC_PL='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13l11-6.5z"/></svg>';
let miniIO=null;
/* QR 음원 화면 아래 '선생님이세요?' 한 줄 — 책 QR은 어디서 산 책이든 원장님을 만나는 곳(학생 화면은 가리지 않게 본문 맨 아래) */
const TSOON=true;   // 선생님 영역 준비 중이면 '선생님이세요?' 줄 숨김
const GEN=['rst1','rst2','rbr1','rbr2','rin1','rin2','rba1','rba2','rmo1','rmo2','gw1','gw2'];   // 시험지 생성기에 있는 책
const QRC=new URLSearchParams(location.search).get('c')||'';                         // 처음 들어온 QR 코드
function teacherLine(b,u){
  if(TSOON) return '';
  const dest=GEN.indexOf(b.code)>=0 ? '/교사포털/시험지생성기/?book='+b.code+'&u='+u : '/library/#teacher';
  const ok=window.SOLVEU&&SOLVEU.isOK&&SOLVEU.isOK();
  const href=ok? dest : '/library/join/?from='+(QRC?'qr':'studio')+'&code='+encodeURIComponent(QRC||(b.code+'u'+u))+'&next='+encodeURIComponent(dest);
  return '<a class="tline" href="'+href+'"><b>선생님이세요?</b><span>이 유닛 워크북 · 수업 자료 무료</span><i>→</i></a>';
}
function fmt(s){ s=Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function leaf(b,u,selP){
  const un=b.units[u-1]; document.title=nm(b)+' Unit '+u+' · 쏠뷰';
  const PAGES=(un.pages&&un.pages.length)?un.pages:null;
  selP=(PAGES && selP>=0 && selP<PAGES.length)?selP:0;
  const src=PAGES?PAGES[selP]:un;   // 페이지 있으면 그 페이지가 단어/음원 출처
  const isSentPage=!!(PAGES && src.sents && src.sents.length);  // 문장읽기 페이지
  const A=PAGES?(isSentPage?{sent:src.audio||''}:{word:src.audio||''}):(un.audio||{});
  const types=[]; if(A.word)types.push({k:'word',l:'단어'}); if(A.sent)types.push({k:'sent',l:'문장'});
  // QR 코드 끝이 s(문장)/w(단어)면 그 음원을 먼저 선택 — 처음 들어온 그 유닛에서만
  const PREF=(function(){ const m=QRC.match(/^([a-z]+\d+)u0*(\d+)([ws])$/i); if(m && m[1]===b.code && parseInt(m[2],10)===u) return m[3].toLowerCase()==='s'?'sent':'word'; return null; })();
  const T0=Math.max(0, types.findIndex(t=>t.k===PREF));
  const ST=isSentPage?(src.st||null):(PAGES?null:(un.st||null));  // 문장 시작시각(탭재생/하이라이트/반복)
  const WT=isSentPage?null:(src.wt||null);  // 단어 시작시각(파닉스 등: 단어 탭재생)
  const SENTSRC=isSentPage?src.sents:(un.sents||[]);
  const words=(isSentPage?[]:(src.words||[])).map((w,i)=>'<div class="row selw'+(WT?' play':'')+'"><span class="n">'+(i+1)+'</span><span class="w">'+esc(w.w)+'</span><span class="m">'+esc(w.m)+'</span></div>').join('');
  const sents=SENTSRC.map((s,i)=>'<div class="srow'+(ST?' play':'')+'"><span class="sn">'+(i+1)+'</span><div class="sc"><span class="se">'+esc(s.e)+'</span><span class="sk">'+esc(s.k)+'</span></div></div>').join('');
  const pgtabs=PAGES?('<div class="pgtabs">'+PAGES.map((p,i)=>{const sub=(p.sub!==undefined?p.sub:(p.p!=null?'p.'+p.p:''));return '<button class="pgtab'+(i===selP?' on':'')+'" type="button" data-pg="'+i+'"><b>'+esc(p.label||('세트 '+(i+1)))+'</b>'+(sub?'<span>'+esc(sub)+'</span>':'')+'</button>';}).join('')+'</div>'):'';
  const wordHead=PAGES?('교재 '+src.p+'쪽 순서 · '+(src.words||[]).length+'개'):('단어 '+(src.words?src.words.length:0)+'개');
  const wordHTML=(!isSentPage&&src.words&&src.words.length)?'<h2>'+wordHead+'</h2><div class="rows">'+words+'</div>':'';
  const sentHead=(isSentPage?(esc(src.label||'문장읽기')+' · '):'')+'문장 '+SENTSRC.length+'개';
  const sentHTML=(SENTSRC.length)?'<h2>'+sentHead+'</h2><div class="rows">'+sents+'</div>':'';
  const toggle= types.length>1 ? '<div class="atog">'+types.map((t,i)=>'<button class="atg'+(i===T0?' on':'')+'" type="button" data-t="'+t.k+'">'+t.l+' 음원</button>').join('')+'</div><br>' : '';
  app.innerHTML='<nav class="crumb" aria-label="위치"><button type="button" data-go="home">음원·강의</button><span>›</span><button type="button" data-go="book" data-book="'+b.code+'">'+esc(nm(b))+'</button></nav>'+
    '<div class="ltop">'+cover(b)+'<div class="tt"><span class="bk">'+esc(nm(b))+'</span><h1>Unit '+u+'</h1></div>'+
    '<div class="unav"><button type="button" id="uprev">이전 유닛</button><button type="button" id="unext">다음 유닛</button></div></div>'+
    pgtabs+
    '<div class="player"><audio id="au" preload="metadata"></audio>'+toggle+
      '<button class="playbig" type="button" id="play" aria-label="재생"><span class="ico" id="ico">▶</span><span class="lbl" id="lbl">듣기</span></button>'+
      '<div class="seekwrap"><input type="range" id="seek" min="0" max="1000" value="0" aria-label="재생 위치">'+
      '<div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div></div>'+
      '<div class="spds"><button class="spd" type="button" data-s="0.8">0.8×</button><button class="spd on" type="button" data-s="1">1.0×</button><button class="spd" type="button" data-s="1.2">1.2×</button></div>'+
    '</div>'+
    ((wordHTML||sentHTML)? '<div class="wl" id="listbox"></div>':'')+
    teacherLine(b,u)+
    '<div class="mini" id="mini" aria-hidden="true"><button type="button" id="mplay" aria-label="재생">▶</button><div class="mt"><b>'+esc(nm(b))+' · Unit '+u+'</b><div class="bar"><i id="mbar"></i></div></div><span class="tm" id="mtm">0:00</span></div>';

  const au=document.getElementById('au'); curAudio=au;
  const play=document.getElementById('play'), ico=document.getElementById('ico'), lbl=document.getElementById('lbl');
  const seek=document.getElementById('seek'), curEl=document.getElementById('cur'), durEl=document.getElementById('dur');
  let curSpd=1, curT=(types.length?types[T0].k:'word');
  const listbox=document.getElementById('listbox');
  let hideMean=false, hideKo=false, repeatOn=false, curIdx=-1, boundEnd=null;
  const hasKo=SENTSRC.some(s=>s.k);   // 해석/발음 있으면 토글 표시
  const koLabel=isSentPage?'발음':'해석';   // 파닉스 문장읽기는 '발음'
  function TIMES(){ return curT==='sent'?ST:(curT==='word'?WT:null); }
  function ROWSEL(){ return curT==='sent'?'.srow':'.row'; }
  function ctrlBar(){
    if(curT==='sent' && SENTSRC.length){
      let h='<div class="lctrl">';
      if(hasKo) h+='<button class="lbtn'+(hideKo?' on':'')+'" type="button" id="tgKo">'+(hideKo?koLabel+' 보기':koLabel+' 숨기기')+'</button>';
      if(ST) h+='<button class="lbtn'+(repeatOn?' on':'')+'" type="button" id="tgRep">한 문장 반복</button>';
      h+='</div>';
      if(ST) h+='<div class="lhint" id="lhint">'+(repeatOn?'반복 켜짐 — 문장을 누르면 그 문장만 계속 반복돼요 (멈추려면 재생 버튼)':'문장을 누르면 그 문장만 재생돼요')+'</div>';
      return h;
    }
    if(curT==='word' && src.words && src.words.length){
      const mlab=PAGES?(hideMean?'소리 보기':'소리 숨기기'):(hideMean?'뜻 보기':'뜻 숨기기');
      let h='<div class="lctrl"><button class="lbtn'+(hideMean?' on':'')+'" type="button" id="tgMean">'+mlab+'</button>';
      if(WT) h+='<button class="lbtn'+(repeatOn?' on':'')+'" type="button" id="tgRep">한 단어 반복</button>';
      h+='</div>';
      if(WT) h+='<div class="lhint" id="lhint">'+(repeatOn?'반복 켜짐 — 단어를 누르면 그 단어만 계속 반복돼요 (멈추려면 재생 버튼)':'단어를 누르면 그 단어만 재생돼요')+'</div>';
      return h;
    }
    return '';
  }
  function highlight(follow){ if(!listbox) return; let el=null; listbox.querySelectorAll(ROWSEL()).forEach((r,i)=>{ r.classList.toggle('cur', i===curIdx); if(i===curIdx) el=r; });
    if(follow && el && !au.paused){ const r=el.getBoundingClientRect(); if(r.bottom>innerHeight-90 || r.top<70) el.scrollIntoView({block:'center',behavior:'smooth'}); } }
  function bindList(){
    const km=document.getElementById('tgKo'); if(km) km.onclick=()=>{ hideKo=!hideKo; km.classList.toggle('on',hideKo); km.textContent=hideKo?koLabel+' 보기':koLabel+' 숨기기'; listbox.classList.toggle('hidek',hideKo); listbox.querySelectorAll('.srow.rv').forEach(r=>r.classList.remove('rv')); };
    const mm=document.getElementById('tgMean'); if(mm) mm.onclick=()=>{ hideMean=!hideMean; mm.classList.toggle('on',hideMean); mm.textContent=PAGES?(hideMean?'소리 보기':'소리 숨기기'):(hideMean?'뜻 보기':'뜻 숨기기'); listbox.classList.toggle('hidem',hideMean); listbox.querySelectorAll('.row.rv').forEach(r=>r.classList.remove('rv')); };
    const rp=document.getElementById('tgRep'); if(rp) rp.onclick=()=>{ repeatOn=!repeatOn; rp.classList.toggle('on',repeatOn); const lh=document.getElementById('lhint'); const isw=(curT==='word'); if(lh) lh.textContent=repeatOn?('반복 켜짐 — '+(isw?'단어':'문장')+'를 누르면 그 '+(isw?'단어':'문장')+'만 계속 반복돼요 (멈추려면 재생 버튼)'):((isw?'단어':'문장')+'를 누르면 그 '+(isw?'단어':'문장')+'만 재생돼요'); };
    if(curT==='sent') listbox.querySelectorAll('.srow').forEach((r,i)=>r.onclick=()=>{ if(hideKo) r.classList.add('rv'); if(ST) playSeg(i); });
    if(curT==='word') listbox.querySelectorAll('.row').forEach((r,i)=>r.onclick=()=>{ if(hideMean) r.classList.toggle('rv'); if(WT) playSeg(i); });
  }
  function renderList(){ if(!listbox) return; listbox.innerHTML=ctrlBar()+((curT==='sent'&&sentHTML)?sentHTML:(wordHTML||sentHTML));
    listbox.classList.toggle('hidem', curT==='word'&&hideMean); listbox.classList.toggle('hidek', curT==='sent'&&hideKo);
    bindList(); highlight(); }
  function playSeg(i){ const T=TIMES(); if(!T) return; curIdx=i; highlight();
    const go=()=>{ boundEnd=(T[i+1]!=null?T[i+1]:(au.duration||1e9)); try{au.currentTime=T[i];}catch(e){} au.playbackRate=curSpd; au.play(); };
    if(au.readyState>=1) go(); else au.addEventListener('loadedmetadata',go,{once:true}); }
  function loadSrc(){ au.src=A[curT]||''; try{au.load();}catch(e){} au.playbackRate=curSpd;
    ico.textContent='▶'; lbl.textContent='듣기'; seek.value=0; curEl.textContent='0:00'; durEl.textContent='0:00'; curIdx=-1; boundEnd=null; renderList(); }
  play.onclick=()=>{ if(au.paused){ boundEnd=null; au.play(); } else au.pause(); };
  const mini=document.getElementById('mini'), mplay=document.getElementById('mplay'), mbar=document.getElementById('mbar'), mtm=document.getElementById('mtm');
  mplay.onclick=()=>play.click();
  if(miniIO) miniIO.disconnect();
  if('IntersectionObserver' in window){ miniIO=new IntersectionObserver(es=>{ const off=!es[0].isIntersecting && es[0].boundingClientRect.top<0; mini.classList.toggle('on',off); mini.setAttribute('aria-hidden',off?'false':'true'); }); miniIO.observe(play); }
  au.onplay=()=>{ ico.textContent='❚❚'; lbl.textContent='듣는 중'; mplay.textContent='❚❚'; };
  au.onpause=()=>{ mplay.textContent='▶'; if(!au.ended){ ico.textContent='▶'; lbl.textContent='계속 듣기'; } };
  au.onended=()=>{ ico.textContent='↺'; lbl.textContent='다시 듣기'; mplay.textContent='↺'; curIdx=-1; highlight(); };
  au.ontimeupdate=()=>{ if(au.duration){ seek.value=Math.round(au.currentTime/au.duration*1000); curEl.textContent=fmt(au.currentTime); mbar.style.width=(au.currentTime/au.duration*100)+'%'; mtm.textContent=fmt(au.currentTime);}
    const T=TIMES();
    if(T){
      if(boundEnd!=null){ if(au.currentTime>=boundEnd-0.04){ if(repeatOn){ au.currentTime=T[curIdx]; } else { au.pause(); boundEnd=null; } } }
      else { let idx=0; for(let j=0;j<T.length;j++){ if(au.currentTime>=T[j]-0.02) idx=j; } if(idx!==curIdx){ curIdx=idx; highlight(true); } }
    } };
  au.onloadedmetadata=()=>durEl.textContent=fmt(au.duration);
  seek.oninput=()=>{ if(au.duration){ boundEnd=null; au.currentTime=seek.value/1000*au.duration; } };
  document.querySelectorAll('.spd').forEach(x=>x.onclick=()=>{ curSpd=parseFloat(x.dataset.s); au.playbackRate=curSpd;
    document.querySelectorAll('.spd').forEach(y=>y.classList.remove('on')); x.classList.add('on'); });
  document.querySelectorAll('.atg').forEach(x=>x.onclick=()=>{ curT=x.dataset.t;
    document.querySelectorAll('.atg').forEach(y=>y.classList.remove('on')); x.classList.add('on'); loadSrc(); });
  loadSrc();
  document.querySelectorAll('.pgtab').forEach(x=>x.onclick=()=>{ const pi=parseInt(x.dataset.pg); if(pi===selP)return; if(curAudio){curAudio.pause();curAudio=null;} leaf(b,u,pi); window.scrollTo(0,0); });
  const prev=document.getElementById('uprev'), next=document.getElementById('unext');
  prev.disabled=(u<=1); next.disabled=(u>=b.units.length);
  prev.onclick=()=>{ if(u>1) go({book:b.code,u:u-1}); };
  next.onclick=()=>{ if(u<b.units.length) go({book:b.code,u:u+1}); };
}

app.addEventListener('click', e=>{
  const t=e.target.closest('[data-go]'); if(!t) return; const g=t.dataset.go;
  if(g==='home') go({});
  else if(g==='book') go({book:t.dataset.book});
  else if(g==='leaf') go({book:t.dataset.book, u:parseInt(t.dataset.u)});
});
render();
</script>

</body>

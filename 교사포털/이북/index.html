<script>/* 선생님 인증(사이트 공통 입장권). 내 컴퓨터 미리보기(localhost)는 통과 */
(function(){ if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
  var p=null; try{ p=localStorage.getItem('solveu_pass'); }catch(e){}
  var go=function(){ location.replace('/library/join/?from=ebook&next='+encodeURIComponent(location.pathname)); };
  if(!p){ go(); return; }
  fetch('https://solveu-auth.tjdals85200.workers.dev/api/me',{headers:{Authorization:'Bearer '+p}}).then(function(r){ if(r.status===401){ try{localStorage.removeItem('solveu_pass')}catch(e){} go(); } }).catch(function(){});
})();</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>저절로 워크북 만들기</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#1f2430; --sub:#5f6775; --muted:#9aa1ad; --line:#e3e6eb;
    --navy:#223A5E; --orange:#E65C21; --navyBg:#eef2f8;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg); color:var(--ink); font-family:"Pretendard","Malgun Gothic","맑은 고딕",sans-serif; line-height:1.5}
  .wrap{max-width:1180px; margin:0 auto; padding:18px 16px 60px}
  .top{display:flex; align-items:center; gap:12px; margin-bottom:14px}
  .top a{font-size:14px; color:var(--sub); text-decoration:none}
  .top a:hover{color:var(--ink)}
  .top h1{font-size:18px; margin:0 0 0 auto; color:var(--navy)}
  .hidden{display:none !important}

  /* 인증 */
  .gate{max-width:400px; margin:48px auto; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 24px; text-align:center}
  .gate h2{font-size:18px; margin:0 0 6px}
  .gate p{font-size:14px; color:var(--sub); margin:0 0 18px}
  .gate button{width:100%; height:48px; border:none; border-radius:10px; background:var(--navy); color:#fff; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit}
  .gate .hint{font-size:12px; color:var(--muted); margin-top:12px}

  /* 왼쪽 고르기 */
  .layout{display:grid; grid-template-columns:300px minmax(0,1fr); gap:18px; align-items:start}
  @media(max-width:880px){.layout{grid-template-columns:1fr}}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; position:sticky; top:12px}
  @media(max-width:880px){.panel{position:static}}
  .step{margin-bottom:18px}
  .step > label, .step > .lb{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; margin-bottom:8px}
  .step .no{display:inline-flex; width:20px; height:20px; border-radius:6px; background:var(--navy); color:#fff; font-size:12px; align-items:center; justify-content:center}
  .step .lb .mini + .mini{margin-left:0}
  .step .lb .mini{margin-left:auto; font-size:12px; color:var(--sub); background:none; border:none; cursor:pointer; font-family:inherit; padding:0 2px}
  select,input[type=text]{width:100%; height:42px; border:1.5px solid #d5d9e0; border-radius:9px; padding:0 10px; font-size:15px; font-family:inherit; outline:none; background:#fff}
  select:focus,input:focus{border-color:var(--navy)}
  .units{display:flex; flex-wrap:wrap; gap:6px}
  .units label{min-width:38px; height:34px; display:inline-flex; align-items:center; justify-content:center; font-size:14px; border:1.5px solid #d5d9e0; border-radius:8px; cursor:pointer; user-select:none; background:#fff}
  .units label.on{background:var(--navy); border-color:var(--navy); color:#fff; font-weight:700}
  .units input{display:none}
  .ulegend{margin-top:8px; font-size:12px; color:var(--sub); line-height:1.65}
  .ulegend b{display:inline-block; min-width:16px; color:var(--ink)}
  .types{display:flex; flex-direction:column; gap:6px}
  .ty{display:flex; align-items:center; gap:10px; border:1.5px solid #d5d9e0; border-radius:9px; padding:8px 10px; cursor:pointer; background:#fff}
  .ty.on{border-color:var(--navy); background:var(--navyBg)}
  .ty input{width:17px; height:17px; accent-color:var(--navy); flex:none}
  .ty b{display:block; font-size:14.5px}
  .ty small{display:block; font-size:12px; color:var(--sub)}
  .step .help{font-size:12px; color:var(--muted); margin-top:5px}
  .go{width:100%; height:48px; border:none; border-radius:10px; background:var(--orange); color:#fff; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit}
  .go:hover{filter:brightness(1.05)}

  /* 오른쪽 미리보기 */
  .bar{display:flex; align-items:center; gap:10px; margin-bottom:10px}
  .seg{display:inline-flex; background:#e8ebf0; border-radius:9px; padding:3px}
  .seg button{border:none; background:none; font-family:inherit; font-size:14px; font-weight:700; color:var(--sub); padding:7px 16px; border-radius:7px; cursor:pointer}
  .seg button.on{background:#fff; color:var(--navy); box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .print{margin-left:auto; height:40px; padding:0 18px; border:none; border-radius:9px; background:var(--navy); color:#fff; font-weight:700; font-size:14px; cursor:pointer; font-family:inherit}
  .preview{background:#e3e6eb; border-radius:14px; padding:20px; overflow:auto; min-height:400px}
  .empty{text-align:center; color:var(--muted); padding:120px 20px; font-size:15px}

  /* ===== 워크북 쪽 (C&S 규격: A4, 좌우 42pt) ===== */
  .preview .pg{zoom:var(--z,1)}                          /* 미리보기 칸 너비에 맞춰 축소(인쇄는 원래 크기) */
  .pg{width:210mm; height:297mm; margin:0 auto 18px; background:#fff; box-shadow:0 1px 8px rgba(0,0,0,.12);
    padding:28pt 42pt 26pt; display:flex; flex-direction:column;
    font-family:"Malgun Gothic","맑은 고딕","Pretendard",sans-serif; color:#1a1a1a}
  .hd{display:flex; align-items:center; gap:9pt; padding-bottom:9pt; border-bottom:1pt solid var(--navy)}
  .bd{flex:none; width:20pt; height:20pt; border-radius:6.4pt; background:var(--navy); color:#fff; font-size:11pt; font-weight:700;
    display:flex; align-items:center; justify-content:center}
  .tt{font-size:12.5pt; font-weight:700; white-space:pre; overflow:hidden; text-overflow:ellipsis}
  .ac{margin-left:auto; font-size:9pt; color:#8a8f98; white-space:nowrap}
  .note{font-size:9pt; font-weight:700; color:var(--navy); margin-top:8pt}
  .bodyc{flex:1; min-height:0; display:flex; gap:18pt; margin-top:10pt}
  .col{flex:1; min-width:0; overflow:hidden; padding-bottom:6pt}
  .bodyc.c2 .col + .col, .bodyc.c3 .col + .col{border-left:0.6pt solid #e6e8ec; padding-left:12pt}
  .ft{border-top:1pt solid var(--navy); padding-top:5pt; text-align:center; font-size:8.5pt; color:#777}
  .it{break-inside:avoid; padding-top:8pt}
  .row{display:flex; gap:6pt; align-items:baseline}
  .n{flex:none; min-width:13pt; font-size:9pt; font-weight:700; color:var(--orange)}
  .pg.ans .n{color:var(--navy)}
  .q{font-size:10.2pt; font-weight:700; word-break:keep-all}
  .ln{height:20pt; border-bottom:0.6pt solid #cfd3d9; margin-left:19pt; display:flex; align-items:flex-end; gap:8pt; padding-bottom:2pt}
  .ln .a{font-size:10pt; font-weight:700; color:var(--orange); line-height:1.35}
  .pg.ans .ln{height:auto; min-height:20pt}            /* 정답이 길면 줄이 늘어남(위 글자와 안 겹치게) */
  .ln .full{font-size:9pt; color:#8a8f98}
  .row .ln.in{flex:1; margin-left:0; height:16pt}
  .s_trans .ln, .s_order .ln{height:22pt}
  .mix{margin:3pt 0 0 19pt; font-size:8.6pt; color:#8a8f98; word-break:keep-all}
  .gapw{letter-spacing:.5pt}
  .gp{display:inline-block; width:9pt; height:11pt; border-bottom:1pt solid #1a1a1a; margin:0 1.5pt; vertical-align:baseline}
  .snd{font-size:9pt; color:#8a8f98; margin-left:4pt}
  .p_gap .ln{height:14pt}

  @media print{
    @page{size:A4; margin:0}
    body{background:#fff}
    .wrap{max-width:none; padding:0}
    .top,.panel,.bar{display:none !important}
    .layout{display:block}
    .preview{background:none; padding:0; border-radius:0; overflow:visible; min-height:0}
    .preview .pg{zoom:1}
    .pg{margin:0; box-shadow:none; page-break-after:always; break-after:page}
    .pg:last-child{page-break-after:auto; break-after:auto}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="/library/">← 자료실</a>
    <h1>워크북 만들기</h1>
  </div>

  <!-- 인증 -->
  <section id="gate" class="hidden">
    <div class="gate">
      <h2>선생님 인증이 필요해요</h2>
      <p>휴대폰 문자로 1분이면 돼요. 처음이면 간단한 신청서만 쓰면 돼요.</p>
      <button onclick="location.href='/library/join/?next='+encodeURIComponent(location.pathname+location.search)">휴대폰으로 입장하기</button>
      <div class="hint">한 번 인증하면 이 기기에서 다음부터 바로 열려요.</div>
    </div>
  </section>

  <section id="app" class="hidden">
    <div class="layout">
      <div class="panel">
        <div class="step">
          <label for="book"><span class="no">1</span>교재</label>
          <select id="book" onchange="onBook()"></select>
        </div>
        <div class="step">
          <div class="lb"><span class="no">2</span>유닛 <button class="mini" onclick="allUnits(true)">전체</button><button class="mini" onclick="allUnits(false)">해제</button></div>
          <div class="units" id="units"></div>
          <div class="ulegend" id="ulegend"></div>
        </div>
        <div class="step">
          <div class="lb"><span class="no">3</span>유형</div>
          <div class="types" id="types"></div>
        </div>
        <div class="step">
          <label for="acad">학원 이름</label>
          <input type="text" id="acad" placeholder="비워 두면 인쇄되지 않아요" oninput="render()">
        </div>
        <button class="go" onclick="make()">만들기</button>
      </div>

      <div>
        <div class="bar">
          <div class="seg">
            <button id="tabQ" class="on" onclick="showTab('Q')">문제지</button>
            <button id="tabA" onclick="showTab('A')">정답지</button>
          </div>
          <button class="print" onclick="window.print()">인쇄하기</button>
        </div>
        <div class="preview" id="preview"><div class="empty">유닛과 유형을 고르고 <b>만들기</b>를 눌러 주세요.</div></div>
      </div>
    </div>
  </section>
</div>
<script src="gen_data.js"></script>
<script src="gen_app.js"></script>
</body>
</html>

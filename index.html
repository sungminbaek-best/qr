<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>저절로리딩 첫모의고사</title>
<style>
  :root { color-scheme: light dark; }
  html,body { height:100%; margin:0; }
  body {
    font-family: "Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
    display:flex; align-items:center; justify-content:center;
    background:#f7f7f9; color:#222; text-align:center; padding:24px;
  }
  @media (prefers-color-scheme: dark){ body{ background:#16171a; color:#eee; } }
  .box{ max-width:420px; }
  .spinner{
    width:38px; height:38px; margin:0 auto 18px;
    border:4px solid rgba(120,120,120,.25); border-top-color:#3a7afe;
    border-radius:50%; animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  h1{ font-size:19px; margin:0 0 8px; }
  p{ font-size:15px; line-height:1.6; margin:6px 0; opacity:.85; }
  .muted{ font-size:13px; opacity:.6; margin-top:16px; }
</style>
</head>
<body>
<div class="box" id="app">
  <div class="spinner"></div>
  <p>연결하는 중…</p>
</div>

<script>
/* =======================================================================
   목적지 표 — 여기 큰따옴표 "" 안의 주소만 바꾸면 됩니다.
   ─ 아직 준비 안 된 곳은 "" 빈칸으로 두세요 → '준비 중' 안내가 뜹니다.
   ─ 줄 맨 뒤의 // 뒤 글자는 설명이라 아무 영향 없습니다.
   ─ 각 줄 끝의 쉼표(,)와 큰따옴표(")는 지우지 마세요.
   ======================================================================= */
var LINKS = {
  // ── 유닛 1 ──
  "u1w":  "",   // 단어 음원 (노션)
  "u1v":  "",   // 유튜브 강의
  // ── 유닛 2 ──
  "u2w":  "",   // 단어 음원 (노션)
  "u2v":  "",   // 유튜브 강의
  // ── 유닛 3 ──
  "u3w":  "",   // 단어 음원 (노션)
  "u3v":  "",   // 유튜브 강의
  // ── 유닛 4 ──
  "u4w":  "",   // 단어 음원 (노션)
  "u4v":  "",   // 유튜브 강의
  // ── 유닛 5 ──
  "u5w":  "",   // 단어 음원 (노션)
  "u5v":  "",   // 유튜브 강의
  // ── 유닛 6 ──
  "u6w":  "",   // 단어 음원 (노션)
  "u6v":  "",   // 유튜브 강의
  // ── 유닛 7 ──
  "u7w":  "",   // 단어 음원 (노션)
  "u7v":  "",   // 유튜브 강의
  // ── 유닛 8 ──
  "u8w":  "",   // 단어 음원 (노션)
  "u8v":  "",   // 유튜브 강의
  // ── 유닛 9 ──
  "u9w":  "",   // 단어 음원 (노션)
  "u9v":  "",   // 유튜브 강의
  // ── 유닛 10 ──
  "u10w": "",   // 단어 음원 (노션)
  "u10v": "",   // 유튜브 강의
  // ── 유닛 11 ──
  "u11w": "",   // 단어 음원 (노션)
  "u11v": "",   // 유튜브 강의
  // ── 유닛 12 ──
  "u12w": "",   // 단어 음원 (노션)
  "u12v": "",   // 유튜브 강의
  // ── 유닛 13 ──
  "u13w": "",   // 단어 음원 (노션)
  "u13v": "",   // 유튜브 강의
  // ── 유닛 14 ──
  "u14w": "",   // 단어 음원 (노션)
  "u14v": ""    // 유튜브 강의   ← 맨 마지막 줄만 쉼표 없음
};
/* ===================== 아래는 손대지 마세요 ===================== */

(function () {
  var code = (location.search || "").replace(/^\?/, "").trim();
  var app = document.getElementById("app");

  function show(title, msg) {
    app.innerHTML =
      '<div class="box"><h1>' + title + '</h1>' +
      (msg ? '<p>' + msg + '</p>' : '') +
      '<p class="muted">저절로리딩 첫모의고사</p></div>';
  }

  if (!code) {
    show("저절로리딩 첫모의고사", "이 페이지는 교재 QR 전용입니다. 교재의 QR코드를 스캔해 주세요.");
    return;
  }
  if (!(code in LINKS)) {
    show("잘못된 QR입니다", "코드 “" + code + "” 를 찾을 수 없어요. QR을 다시 스캔해 주세요.");
    return;
  }
  var dest = LINKS[code];
  if (dest && dest.length > 0) {
    location.replace(dest);        // 목적지로 이동
  } else {
    show("준비 중이에요", "이 자료는 곧 열립니다. 잠시 후 다시 스캔해 주세요.");
  }
})();
</script>
</body>
</html>

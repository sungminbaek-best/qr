<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>저절로 · 쏠뷰</title>
<style>
  :root { color-scheme: light dark; }
  html,body { height:100%; margin:0; }
  body {
    font-family: "Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
    display:flex; align-items:center; justify-content:center;
    background:#f7f7f9; color:#222; text-align:center; padding:24px;
  }
  @media (prefers-color-scheme: dark){ body{ background:#16171a; color:#eee; } }
  .box{ max-width:420px; }
  .spinner{
    width:38px; height:38px; margin:0 auto 18px;
    border:4px solid rgba(120,120,120,.25); border-top-color:#3a7afe;
    border-radius:50%; animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  h1{ font-size:19px; margin:0 0 8px; }
  p{ font-size:15px; line-height:1.6; margin:6px 0; opacity:.85; }
  .muted{ font-size:13px; opacity:.6; margin-top:16px; }
</style>
</head>
<body>
<div class="box" id="app">
  <div class="spinner"></div>
  <p>연결하는 중…</p>
</div>

<script>
/* =======================================================================
   목적지 표 — 여기 큰따옴표 "" 안의 주소만 바꾸면 됩니다.
   ─ 아직 준비 안 된 곳은 "" 빈칸으로 두세요 → '준비 중' 안내가 뜹니다.
   ─ 줄 맨 뒤의 // 뒤 글자는 설명이라 아무 영향 없습니다.
   ─ 각 줄 끝의 쉼표(,)와 큰따옴표(")는 지우지 마세요.

   코드 규칙:  gw2 = 저절로그래머&라이팅 2권 / u01~u14 = 유닛 / w=단어음원 v=유튜브강의
   (다른 책을 추가할 땐 새 책코드로 아래에 줄을 더 넣으면 됩니다. 예: mo3u01w)
   ======================================================================= */
var LINKS = {
  // ══ 저절로그래머&라이팅 2권 (gw2) ══
  // ── 유닛 1 ──
  "gw2u01w": "",   // 단어 음원 (노션)
  "gw2u01v": "https://www.youtube.com",   // [테스트] 유튜브 강의 — 확인 후 "" 로 되돌리기
  // ── 유닛 2 ──
  "gw2u02w": "",   // 단어 음원 (노션)
  "gw2u02v": "",   // 유튜브 강의
  // ── 유닛 3 ──
  "gw2u03w": "",   // 단어 음원 (노션)
  "gw2u03v": "",   // 유튜브 강의
  // ── 유닛 4 ──
  "gw2u04w": "",   // 단어 음원 (노션)
  "gw2u04v": "",   // 유튜브 강의
  // ── 유닛 5 ──
  "gw2u05w": "",   // 단어 음원 (노션)
  "gw2u05v": "",   // 유튜브 강의
  // ── 유닛 6 ──
  "gw2u06w": "",   // 단어 음원 (노션)
  "gw2u06v": "",   // 유튜브 강의
  // ── 유닛 7 ──
  "gw2u07w": "",   // 단어 음원 (노션)
  "gw2u07v": "",   // 유튜브 강의
  // ── 유닛 8 ──
  "gw2u08w": "",   // 단어 음원 (노션)
  "gw2u08v": "",   // 유튜브 강의
  // ── 유닛 9 ──
  "gw2u09w": "",   // 단어 음원 (노션)
  "gw2u09v": "",   // 유튜브 강의
  // ── 유닛 10 ──
  "gw2u10w": "",   // 단어 음원 (노션)
  "gw2u10v": "",   // 유튜브 강의
  // ── 유닛 11 ──
  "gw2u11w": "",   // 단어 음원 (노션)
  "gw2u11v": "",   // 유튜브 강의
  // ── 유닛 12 ──
  "gw2u12w": "",   // 단어 음원 (노션)
  "gw2u12v": "",   // 유튜브 강의
  // ── 유닛 13 ──
  "gw2u13w": "",   // 단어 음원 (노션)
  "gw2u13v": "",   // 유튜브 강의
  // ── 유닛 14 ──
  "gw2u14w": "",   // 단어 음원 (노션)
  "gw2u14v": ""    // 유튜브 강의   ← 맨 마지막 줄만 쉼표 없음
};
/* ===================== 아래는 손대지 마세요 ===================== */

(function () {
  var code = (location.search || "").replace(/^\?/, "").trim();
  var app = document.getElementById("app");

  function show(title, msg) {
    app.innerHTML =
      '<div class="box"><h1>' + title + '</h1>' +
      (msg ? '<p>' + msg + '</p>' : '') +
      '<p class="muted">저절로 · 쏠뷰</p></div>';
  }

  if (!code) {
    show("저절로 · 쏠뷰", "이 페이지는 교재 QR 전용입니다. 교재의 QR코드를 스캔해 주세요.");
    return;
  }
  if (!(code in LINKS)) {
    show("잘못된 QR입니다", "코드 “" + code + "” 를 찾을 수 없어요. QR을 다시 스캔해 주세요.");
    return;
  }
  var dest = LINKS[code];
  if (dest && dest.length > 0) {
    location.replace(dest);        // 목적지로 이동
  } else {
    show("준비 중이에요", "이 자료는 곧 열립니다. 잠시 후 다시 스캔해 주세요.");
  }
})();
</script>
</body>
</html>
